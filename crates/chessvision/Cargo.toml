[package]
name = "pdfcraft-chessvision"
description = "Chess vision for PdfCraft: find and read chess diagrams and chess text on PDF pages"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-chess = { workspace = true }
# Same inference runtime and format as pdfcraft-ocr: pure Rust, builds for wasm32.
rten = { version = "0.26.0", default-features = false, features = ["rten_format"] }
# Contours, polygon simplification and minimum-area rectangles for the page detector (no OpenCV).
rten-imageproc = { version = "0.26.0", default-features = false }
thiserror.workspace = true
