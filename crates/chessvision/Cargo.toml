[package]
name = "pdfcraft-chessvision"
description = "Chess vision for PdfCraft: find and read chess diagrams and chess text on PDF pages"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-chess = { workspace = true }
# L0: `PageRect` and `Rotation`, the page geometry `coords` converts between spaces.
pdfcraft-geom = { workspace = true }
# Same inference runtime as pdfcraft-ocr: pure Rust, builds for wasm32. `onnx_format` loads the
# user's exported .onnx models directly (no conversion step).
rten = { version = "0.26.0", default-features = false, features = ["rten_format", "onnx_format"] }
rten-tensor = "0.26.0"
serde.workspace = true
serde_json.workspace = true
# Contours, polygon simplification and minimum-area rectangles for the page detector (no OpenCV).
rten-imageproc = { version = "0.26.0", default-features = false }
thiserror.workspace = true
