[package]
name = "pdfcraft-chessvision"
description = "Chess vision for PdfCraft: find and read chess diagrams and chess text on PDF pages"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The same version and features as pdfcraft-chess (MIT, `pext` off for wasm32): `doc::games`
# replays the games it finds in a document's text.
cozy-chess = { version = "0.3.4", default-features = false, features = ["std"] }
pdfcraft-chess = { workspace = true }
# L0: `PageRect` and `Rotation`, the page geometry `coords` converts between spaces.
pdfcraft-geom = { workspace = true }
# L3: `TextGlyph` / `PageText`, the page text layer `chess_text` reads (with font name and code).
pdfcraft-render = { workspace = true }
# Same inference runtime as pdfcraft-ocr: pure Rust, builds for wasm32. `onnx_format` loads the
# user's exported .onnx models directly (no conversion step).
rten = { version = "0.26.0", default-features = false, features = ["rten_format", "onnx_format"] }
rten-tensor = "0.26.0"
# Glyph outlines of the user's chess diagram font, for drawn diagrams (same version as pdfcraft-fonts).
skrifa = "0.44"
# The user's piece images (`pieces::images`), traced into outlines; pure Rust, builds for wasm32.
# Also decodes the prototype's PNG boards in the board-reading benchmark (`examples/read_bench.rs`).
png = "0.18"
# The figurine font as a data URL in HTML exports (`text_font`); pure Rust, builds for wasm32.
base64 = "0.22"
# SVG piece images (`pieces::svg`): their paths, resolved. Already in the tree (egui_extras > resvg);
# without text, pure Rust, builds for wasm32.
usvg = { version = "0.45", default-features = false }
serde.workspace = true
serde_json.workspace = true
# Contours, polygon simplification and minimum-area rectangles for the page detector (no OpenCV).
rten-imageproc = { version = "0.26.0", default-features = false }
thiserror.workspace = true

[dev-dependencies]
# A compressed (svgz) piece in the SVG tests.
flate2.workspace = true
proptest.workspace = true
# The OCR benchmark (`examples/ocr_bench.rs`) only: the general OCR whose words the glyph reader is
# fused with (the engine passes them in; `pdfcraft-ocr` is the same layer, so the example uses the
# external crate directly), and NFKC for the Caïssa scorer.
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
unicode-normalization = "0.1"
