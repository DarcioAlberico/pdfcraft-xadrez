[package]
name = "pdfcraft-chess"
description = "Chess knowledge for PdfCraft: positions, legality, notation, NAGs, lichess links, recognition post-processing and board drawing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# MIT. `pext` stays off: it is x86-only and the crate must build for wasm32.
cozy-chess = { version = "0.3.4", default-features = false, features = ["std"] }
# MIT OR Apache-2.0. A diagram's reading kept on disk (plan A9-N5a): its positions, legality
# and mate reports are written as JSON by the engine. Already in the graph through chessvision.
serde = { workspace = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
