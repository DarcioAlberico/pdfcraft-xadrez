evidence = ["crates/ui-egui/tests/chess.rs::each_diagram_opened_is_a_new_game_and_the_first_is_kept", "crates/ui-egui/tests/chess.rs::the_games_come_back_exactly_in_the_next_session", "crates/ui-egui/tests/chess.rs::saving_a_pdf_without_an_id_rekeys_its_games", "crates/ui-egui/tests/chess.rs::unreadable_game_files_are_set_aside_and_said", "crates/ui-egui/tests/chess.rs::a_second_instance_does_not_overwrite_the_games_of_the_first", "crates/ui-egui/tests/chess.rs::a_protected_document_asks_before_its_games_are_written", "crates/ui-egui/tests/chess.rs::a_pgn_file_with_several_games_is_imported", "crates/ui-egui/src/chess_autosave.rs::a_game_comes_back_as_it_was_with_what_pgn_cannot_hold", "crates/ui-egui/src/chess_autosave.rs::the_web_store_round_trips_caps_and_sets_bad_values_aside", "crates/ui-egui/src/chess_collection.rs::switching_keeps_the_order_and_every_game", "crates/chess/src/game/split.rs::a_multi_game_pgn_splits_on_its_tag_lines", "crates/engine/src/chess/keys.rs::saving_a_file_without_an_identifier_gives_it_one", "crates/ui-egui/tests/chess_games.rs::a_game_renamed_through_its_tags_shows_in_the_list_and_in_the_exported_pgn", "crates/ui-egui/tests/chess_games.rs::duplicating_makes_an_identical_game_after_it", "crates/ui-egui/tests/chess_games.rs::deleting_asks_first_and_the_last_delete_leaves_a_blank_game", "crates/ui-egui/tests/chess_games.rs::reordering_changes_the_export_order", "crates/ui-egui/tests/chess_games.rs::a_new_game_from_here_starts_at_that_position", "crates/ui-egui/tests/chess_games.rs::delete_on_a_focused_row_is_the_lists_and_on_the_board_the_games", "crates/ui-egui/tests/chess_games.rs::the_order_and_the_names_come_back_in_the_next_session", "crates/ui-egui/src/chess_collection.rs::moving_duplicating_and_deleting_keep_the_order_and_the_game_shown", "crates/ui-egui/src/chess_collection.rs::renaming_sets_the_names_and_the_other_tags_in_one_undo_step", "crates/ui-egui/src/chess_collection.rs::a_new_game_from_here_starts_at_the_position_and_refuses_an_illegal_one", "crates/ui-egui/src/chess_autosave.rs::every_truncation_of_a_games_file_is_set_aside", "crates/ui-egui/src/chess_autosave.rs::mutated_games_files_never_panic", "crates/engine/src/chess/collection.rs::moving_to_any_place_keeps_the_game_shown", "crates/engine/src/chess/collection.rs::deleting_returns_the_game_and_inserting_puts_it_back", "crates/ui-egui/src/chess_collection.rs::undo_takes_back_deletes_and_moves_the_newer_step_first", "crates/ui-egui/src/chess_collection.rs::the_lists_history_is_capped", "crates/ui-egui/src/chess_collection.rs::a_dropped_row_goes_into_the_gap_it_was_dropped_in", "crates/ui-egui/tests/chess_games.rs::undo_takes_back_a_delete_and_a_move_and_rows_can_be_dragged", "crates/ui-egui/src/chess_collection.rs::undo_takes_back_new_and_duplicated_games_and_keeps_a_changed_one", "crates/ui-egui/src/chess_collection.rs::the_games_of_a_pgn_are_one_step_of_the_list", "crates/ui-egui/src/chess_collection.rs::undo_puts_a_restored_game_back_in_the_trash", "crates/ui-egui/src/chess_trash.rs::a_game_taken_out_goes_back_to_its_place_and_is_found_again", "crates/ui-egui/tests/chess_games.rs::undo_takes_back_games_added_and_keeps_a_changed_one", "crates/ui-egui/tests/chess_games.rs::undo_takes_back_a_diagram_opened_on_the_board", "crates/ui-egui/tests/chess_games.rs::games_selected_with_ctrl_and_shift_are_deleted_moved_and_saved_together", "crates/ui-egui/tests/chess_games.rs::the_keys_of_a_focused_row_select_and_act_on_several_games", "crates/ui-egui/tests/chess_games.rs::the_list_renames_site_date_and_round_and_refuses_a_date_pgn_cannot_read", "crates/ui-egui/tests/chess_book.rs::a_move_of_the_text_tab_opens_its_game_on_the_board", "crates/automation/tests/chess.rs::chess_games_renames_duplicates_deletes_moves_and_starts_games_from_a_position", "crates/automation/tests/chess.rs::chess_games_starts_a_game_at_a_position_set_up", "crates/automation/tests/chess.rs::chess_games_refuses_what_the_list_does_not_allow", "crates/automation/tests/chess.rs::chess_games_reads_and_writes_pgn_files_inside_the_root_only", "apps/pdfcraft-cli/tests/chess.rs::chess_games_runs_from_a_script_inside_the_root"]
notes = "An extension, not an Acrobat parity claim (fork decision D3); PGN toolbar spec steps T4b and T14. Every open document has its own games (and the board has a set for when no document is open); the board panels show the active one. A diagram opened on the board (double-click, Open on the board) is a new game, never written over the one there; the same untouched diagram opened twice shows its game again. Games in this document lists them by players, diagram and page, or number; a click shows one (not an undo step); New game, Open PGN… (every game of a file, at most 256, split at tag lines), Save PGN… and Save all games as PGN… (a file the user picks; a download on the web; refused for a document that forbids copying). Autosave: 2 s after the last change, when a document closes and on exit, one file per document in the recovery folder's chess subfolder (two JSON lines: a header with the document's keys /ID[0], path, name+size, and the body: per game its PGN, the move shown, the board side, an illegal position's FEN, the diagram it came from, where each move was read, and the comments PGN can't place), written atomically under the recovery instance lock; another running instance's file is left alone and said; the keys are taken again after every save (a first /ID, a new size or path). Unreadable, oversized or other-version files are renamed .bad and said, never deleted; fuzzed (T16): every truncation of a valid file but the one losing only its last line break is set aside, and random bytes, bytes of a valid file changed, and valid JSON with random values anywhere never panic in the file store or the web's. Caps: 256 games and 32 MiB per document (above them autosave stops for that document and says so; nothing is evicted). Encrypted or no-copy documents ask once per session before anything is written. The web build keeps them in eframe's Storage (pdfcraft-chess-games-v1, 4 MiB for all documents), written when eframe saves (about every 30 s and on unload), with no lock between browser tabs and only the last unreadable value kept aside. T14: each game has a menu (Rename…, Duplicate, Move up, Move down, Delete…), icon buttons on the row under the pointer, keys on a focused row (F2 renames, Delete or Backspace asks to delete, Alt+Up/Down move it, Enter shows it; Tab and the arrows walk the list), and rows can be dragged to another place (a line shows where the row goes). Rename edits the White, Black and Event tags in one undo step of that game, so the name is in the PGN (a game is listed by its players, else its event, diagram or number). Duplicate puts a copy with its own history after the original and shows it. Delete asks “Delete this game? You can undo it.”; the game after it is shown, and deleting the last game leaves a blank one. The list order is the export and autosave order; Export… in the list header writes every game in that order, a blank line between games, and says how many illegal positions were left out. New game from this position (command, and a move's menu in the notation) starts a game at that move's FEN (SetUp/FEN tags), keeping the board side and the diagram it came from; an illegal position is refused with a reason. While a row or a list button has the keyboard, the chess key scope takes no key and the row's keys are taken in raw_input_hook, so Delete there never deletes a variation, page or annotation. Registered commands: chess.game.new_from_here, chess.game.duplicate, chess.game.rename, chess.game.delete (rename and delete open the editor or question in the board panel). Wave 10 U2: the list itself (order, game shown after each change, blank game left by the last delete, names from the White/Black/Event tags, PGN split, a game from a move's position) is the engine's chess::collection::GameList, which the app's list and the headless tool both go through; the app keeps the boards, the undo and the autosave on top (its format and behaviour unchanged). A delete or a move (menu, keys or drag) is a step of the list's own history (200 steps / 64 MiB, this session only), which Undo and Redo (Ctrl+Z, the menu, the rail) take in the chess scope (D12) when it is newer than the last change to the game shown, named “Undo Delete game” / “Undo Move game”; undoing a delete puts the game back at its place with its own history, shown if it was. Games added are list steps too (2026-10-23): New game, Duplicate, New game from this position (from a move or a position set up), Open PGN… (every game it added, one step, “Undo Load the PGN”), the PGN field's games after its first (view.chess-analysis-board), Open as a new game from Deleted moves, and a diagram opened on the board (double-click, Open on the board in the panel and its editor: “Undo Load the diagram”; the move number the page's moves give it later, #129, is no step of its own and goes with it) or a game of the book opened from the Text tab (double-click a move, or Open this game on the board: “Undo Open this game on the board”), 2026-10-23, the same untouched one opened again being shown, no step; Undo takes the games back out and shows the game shown before them, Redo puts the same games back where they were, with their own histories. Undo never loses a change made to an added game: a game changed after it was added (it has undo or redo steps) also goes into Deleted moves (the document's trash, kept with the autosave) when Undo takes it out, the notice says so (“Undid Duplicate game · 1 changed game was kept in Deleted moves.”), and Redo takes it out of there again; the redo step itself goes at the next change to the list, the copy in Deleted moves stays (an illegal position, having no PGN, stays on the redo side only). Undo of Open as a new game puts the item back at its place in Deleted moves. New game on a lone blank game adds nothing and is no step. Headless: chess_games takes a collection as PGN (inline, or a .pgn file under --root), applies list, set_active, rename, duplicate, delete, move (to any place), new_from (an address as in chess_pgn_edit) and export, returns the list and the PGN in list order, and with out writes it (atomically, only when every op applied); both paths are confined to --root (tested with confinement switched off, where the test fails); it works on PGN text and files, not on the app's autosaved collections. Several games at once (2026-10-24): Ctrl+click adds a game to the selection or takes it out, Shift+click selects the games from the last one clicked, and on a focused row Shift+↑/↓ selects on (the keyboard going with it), Ctrl+A selects every game and Ctrl+Space picks one; the game shown stays shown (in bold when it is not selected), and each row's selected state is its button's toggled state for screen readers. A selected row's menu, its buttons and its keys act on all of them as one step of the list: Delete… (one question, “Delete these games? You can undo it.”, under “3 selected”; Undo puts each back at its place and shows the game shown before), Duplicate (a copy after each, the first shown), Move up/down and Alt+↑/↓ (a block, each keeping its order; refused at the ends) and dragging by any of them (together into the gap dropped in), and Save PGN… (the games selected, in list order; Rename… is for one game). Rename… in the list edits Site, Date and Round with White, Black and Event (2026-10-24), as Game details names them, in one undo step of the game; a date must be YYYY.MM.DD with ? for each unknown digit and a real month and day (chess::collection::pgn_date_ok), else the editor says so and Rename waits, and Game details says so under a date it keeps as typed; chess_games' rename takes site, date and round (a bad date refused) and its list reports them. Missing: the headless tool cannot reach the app's autosaved collections (they live in the app's data folder under its instance lock), and the undo history across sessions (each game's history keeps whole snapshots of the game and the list's keeps whole games, which the autosave would have to write as PGN step by step under its own caps: not done); the steps of several games are named as one game's (“Undo Delete game”)."

[[feature]]
id = "chess.book-reference-pgn"
title = "Take a book's own PGN as the reference for the chess text read from it"
area = "I"
tier = "P2"
milestone = "none"
status = "partial"
commands = []
tools = ["chess_document", "chess_diagram_states", "chess_export_pgn", "chess_reference_set", "chess_reference_status", "chess_reference_clear"]
evidence = ["crates/automation/tests/chess.rs::the_books_pgn_kept_with_the_document_is_used_until_it_is_removed", "crates/engine/src/chess/reference_store/tests.rs::a_file_round_trips_and_bad_tampered_or_newer_files_are_told_apart", "crates/engine/src/chess/reference_store/tests.rs::the_folder_keeps_replaces_and_removes_a_documents_pgn", "crates/engine/src/chess/reference_store/tests.rs::a_saved_document_keeps_its_pgn_under_its_new_keys", "crates/automation/tests/chess.rs::chess_export_pgn_writes_the_books_pgn_with_its_text", "crates/chessvision/src/doc/reference/annotate/tests.rs::the_books_text_becomes_the_comments_of_its_pgn", "crates/chessvision/src/doc/reference/annotate/tests.rs::the_annotated_pgn_reads_back_with_every_move", "crates/automation/tests/chess.rs::chess_document_links_the_moves_to_the_books_pgn", "crates/automation/tests/chess.rs::the_books_pgn_confirms_a_diagram_and_suggests_a_near_one_without_writing_a_correction", "crates/chessvision/src/doc/reference/tests.rs::link_confirms_the_diagrams_the_pgn_shows_and_suggests_the_near_ones", "crates/engine/src/chess/tests.rs::a_reading_the_books_pgn_has_is_confirmed_by_it", "crates/automation/tests/chess.rs::chess_document_reference_pgn_outside_the_root_is_refused", "crates/chessvision/src/doc/reference/tests.rs::link_keeps_the_links_on_the_moves_and_marks_what_the_pgn_recovered", "crates/chessvision/src/doc/reference/tests.rs::link_warns_when_the_pgn_is_not_the_books", "crates/chessvision/src/doc/reference/tests.rs::a_caption_read_as_a_move_is_confirmed_and_the_line_after_it_recovered", "crates/chessvision/src/doc/reference/tests.rs::a_transposition_keeps_each_page_in_its_own_game", "crates/chessvision/src/doc/reference/tests.rs::align_never_panics_and_links_every_move"]
notes = "An extension, not an Acrobat parity claim (fork decision D3); plan \"Carregar PGN do livro\" (docs/chess/plano-pgn-do-livro.md), steps R1 to R5, 2026-10-30. chess_document's reference_pgn (confined to --root, at most 32 MiB and 4,096 games) indexes the book's PGN by position and links each move of the text as confirmed, recovered (its reader status kept, with a from_reference review flag), conflict or absent; each move of the document JSON gets reference {kind, game, node}, and the reply sums it up with the game each page discusses and a warning when under 30% of the moves on the first 20 pages read are in the PGN. Diagrams (R3): one whose pieces are those of the PGN move it was aligned with is confirmed and takes the PGN's side to move, castling and move number (the reading as read kept beside it); one 1 or 2 squares from a position linked on its page or the pages beside it gets a suggestion, its reading left alone, and nothing is written to the corrections; chess_diagram_states counts a reading the PGN has as reference. Annotated PGN (R4): chess_export_pgn's reference_pgn writes the PGN's games, every line and glyph kept, with the book's text between linked moves as comments (figurines as letters, $220 on a move a diagram shows, the Position after: cue of a caption left out), the moves the reader played that the PGN lacks as variations commented only in the book, in the book's language, and PdfPage/PdfPageLabel/SourceTitle tags; on the Chessable book's first 60 pages it comments 368 moves, adds 7 book-only moves and 73 diagram marks in 10 ms, and python-chess reads it back with no error and every move sequence of the PGN. Kept with the document (R5): chess_reference_set keeps a copy of the PGN (its text, hash, size and file name, never its path) in a folder confined to --root, one JSON file per document found as the diagram corrections are, a newer version only read and a bad file set aside; chess_document, chess_diagram_states and chess_export_pgn use it when not given reference_pgn, unless reference is false, and doc_save as another file keeps it; chess_reference_status and chess_reference_clear show and remove it. On the 60 measured pages of a Chessable book it confirms 1,000 of 1,036 valid moves and recovers 118 of the 223 the reader could not play. Missing: the app (no way to choose the PGN, no Confirmed by the PGN chip, no way to apply a suggestion, and the app does not read or keep the stored PGN, nor carry it on Save As: R6), the games are not replayed from a confirmed diagram's new side to move, the Export menu's Annotated PGN item (R6), and text the PDF extraction puts out of order lands in the wrong comment."

