, "crates/chess/src/game.rs::stepping_back_out_of_a_variation_and_forward_again_returns_into_it", "crates/chess/src/game.rs::a_reply_is_chosen_by_its_index_and_remembered", "crates/chess/src/game.rs::moving_around_and_playing_never_lose_a_move", "crates/ui-egui/src/chess_deleted.rs::a_new_step_that_takes_moves_away_is_told_and_undo_is_not", "crates/ui-egui/tests/chess.rs::a_position_set_up_over_a_game_with_moves_is_a_new_game", "crates/ui-egui/src/chess_collection.rs::a_position_set_up_is_a_new_game_and_the_game_shown_keeps_its_moves", "crates/ui-egui/tests/chess.rs::deleted_moves_are_kept_and_open_again_as_a_new_game", "crates/ui-egui/src/chess_trash.rs::the_newest_are_kept_within_the_caps", "crates/ui-egui/src/chess_trash.rs::a_game_is_taken_out_by_its_index_and_the_stored_order_comes_back", "crates/ui-egui/src/chess_autosave.rs::the_web_store_round_trips_caps_and_sets_bad_values_aside", "crates/chess/src/nag.rs::the_table_has_every_standard_code_and_the_chesspad_ones", "crates/chess/src/nag.rs::close_signs_stay_apart", "crates/chess/src/nag.rs::every_code_round_trips", "crates/chess/src/game.rs::every_glyph_code_round_trips_through_pgn", "crates/chessvision/src/chess_text/tests.rs::chesspad_and_space_signs_are_read_and_kept_apart", "crates/ui-egui/src/chess_annotate.rs::every_glyph_is_drawn_by_a_bundled_font_or_painted", "crates/ui-egui/tests/chess_palette.rs::the_palette_lists_the_assessments_without_a_sign"]
notes = "An extension, not an Acrobat parity claim (fork decision D3); PGN toolbar spec steps T1a-T1c. Headless, chess_pgn_edit takes a PGN or FEN inline (no file, no path argument) and applies operations at a main-line half-move or a reply path: play, comment, comment-before, set a glyph, promote a variation one level, make a line the main one, demote, delete a variation, cut, and graft a fragment of move items (follow as a variation, Line making the new move the first reply, or as a comment) with a report of what played, where and why it stopped, unbalanced parentheses, unplaced glyphs and comments and the leftover text; a refused operation changes nothing. pdfcraft_chess::game::Game::graft is pure and idempotent, sets glyphs by the side they speak of and never cuts a comment silently. In the app, the chess board's tool rail has the structure tools, on their keys while the chess key scope is on, in a move's context menu and as registered commands (T5a, T5b), and (T6) the 28 common glyphs in three groups (named for their meaning, the side's code for the side-dependent ones), glyphs typed with the scope on (!, ?, !!, ??, !?, ?!, =, +=, =+, +/-, -/+, +-, -+, ~ with a 600 ms wait for two-character signs; 0 clears), a comment editor with the comment before the move (warning where PGN has no place for it) and a glyph palette (figurines, glyphs, ½ – × † ‡); each change is one undo step. U1 makes the palette a floating window (over the board panel or the chess window, kept within it, movable, reopened where it was left for the session, closed by Esc, its button, G): a glyph clicked goes on the move shown as the rail's do, the other characters at the end of the move's comment, and anything at the cursor of the field that had the keyboard; a click in it keeps the chess key scope on. A move's context menu has the six move-quality glyphs, the evaluations and Remove all glyphs for that move, and lists under a structure tool the variations on the way to the move it could act on (§4.5), as the Structure group's popup does. The game has its own undo history (T4a, crates/ui-egui/src/chess_history.rs): every change to the board's game is one step holding the board as it was, typing in a field one step per visit, capped at 200 steps and 64 MiB per game (oldest first); Undo and Redo follow the scope of the last action (D12): a click in the chess panels or a change to the game puts them, and the chess keys, on the game, a click on the page or a document edit back on the document, so Delete and the arrows with the scope on never touch pages or annotations (the keys are taken in raw_input_hook before any shortcut sees them, never while a text field, a popup or a modal has them). Only the six move-quality glyphs are registered commands. T15 adds: the glyph brush (a rail mode, B: each move clicked in the notation gets the brush's glyph or loses it, one undo step a click, Esc disarms); moving a variation one place up or down among its siblings (Alt+Up/Alt+Down, the Structure group, a move's menu, chess.variation.up/down; the line itself never moves; Game::move_variation is property-tested with up then down as the identity); the threat, a null move (Game::play_null, written -- in PGN and read back, also as Z0 or 0000; refused in check; the graft now plays -- too and stops only where the side to move is in check); a diagram mark per move, kept as NAG $220 ($221 is read as one too) and shown as a small board in the notation, toggled from a move's menu; and copying the line up to a move (from the start of its variation, or of the game on the main line) as running text with figurines or letters and glyphs (18.♘d5! ♕xe1 19.♘xe7+). The diagram NAG is a de-facto extension, not part of the PGN standard: $220/$221 are taken from the public table of non-standard NAGs (Wikipedia, which attributes them to the ChessPad editor); whether ChessBase-family programs write the same code could not be confirmed from public documentation, so their diagram marks may not be recognised. chess_pgn_edit has play_null, move_variation and diagram ops. Stepping back remembers the line stepped back along (A8 V1): forward retraces it, into a variation when that is where it went, until another reply is chosen (Game::forward_to) or a move off it is shown; the end of the line shown is that line's, Game::go_to_main_end the main line's; a variation nested past 32 is refused as too deep, apart from a game too long; chess_pgn_edit has back, forward (n moves, from the move shown or at) and choose (a reply by index) ops; property-tested: moving around and playing never lose a move Moves taken out of the game by any command are told in a strip at the top of the board panel (it pushes the panel down, covering nothing) with Undo, until the game changes again or it is dismissed (A8 V2a, chess_deleted: a new undo step after which the game has fewer moves; Undo and Redo are not told); Backspace goes back a move and no longer deletes a variation (Delete does). The game as it was before goes into the document's trash (A8 V5, chess_trash: the newest 30, PGN up to 256 KB each), autosaved with the games (Body.trash; older files read with none), and Deleted moves (n)… under the list of games opens one as a new game. Missing: the trash has no headless tool (it lives in the app's autosave, outside --root; chess_games new_at puts a position back as a game). Fuzzed (T16): random lists of well-formed and malformed operations at addresses that are and are not there, on the scenario's game, on games earlier lists built and on mutated PGN, never panic, stop at the first refusal and reply with a PGN that reads back to itself; the 2,000-operation and 20,000-move caps refuse the call. Capturing a selection from the page into a game, as one undo step, is edit.chess-text-capture. Every NAG (2026-10-22): pdfcraft_chess::nag::NAGS has every code of the PGN standard (1-139) and of the ChessPad extension listed in the public table of non-standard NAGs (140-146, 238-255), 164 codes in 105 entries, the side pairs by the code of the side that moved (names in this table's own words); the assessments with no printed sign (most of the standard's) have no glyph, are written $n and are never looked for in text. New signs read in books and after moves: ○ ($26/$27; ChessPad's $238 is drawn alike but not read), ⇔ ⇗ ⊞ ⟫ ⟪ ✕ ⊥ ∟ ⯺ ⯻ ⯼ ⯽ ⯾ and == ($144), with ⯹ an alias of ©, and the bishop signs (no Unicode character) as the stand-ins ⧉ □■ ■■, read only glued after a move; the ISChess letters were checked against the font's drawings and now give these signs (W the ring for space, [ zugzwang, k the weak point's cross, w without, p-s the pawn signs, m-o the bishop signs, ! (∞ over =) compensation as the user identified it, not good move), and HTML/EPUB export writes them in the font; = stays $10, ⇔ is not counterplay, ✕ is not the capture sign ×, a promotion stays the move's. Re-reading the ten stored book stretches before and after with pdfcraft-cli chess_document, then examples/walk_bench.rs and fragment_bench.rs: 2,841 valid moves and 324 of 333 variations reproduced both times, every move's status identical; the whole text layers of 13 books (about 11.2 million characters) hold none of the new one-character signs, and == only in OCR rule lines. The palette adds == to the move row, a row of positional signs and, folded under More assessments, the assessments without a sign by name in eight sections or narrowed by a filter (name or $n), in a list scrolled within the room left in the window (the palette never runs past the window's bottom and moves up when the list opens too low), each going on the move with the side's code even while a field had the keyboard (one undo step); the notation names them after the move (muted, $n as tooltip); ⌓, ⇗, ⯺ ⯻ ⯼ ⯽, ∟ ⯾ and the three bishop signs (which have no Unicode character) are painted in the palette, on the rail and in the notation, as no bundled font draws them. Missing: a move's menu offers only the move-quality glyphs and the evaluations, and the rail only the 28 common glyphs (the others are in the palette); the bishop signs are $n in PGN and stand-ins (⧉ □■ ■■) in copied text, as no character exists; the interface draws the signs with its painted icons even where the user has ISChess (that font is only used by the HTML/EPUB export); the comment-before of a first reply is written into the move before's comment in PGN (it is kept apart only in the game, and in the app's autosave, edit.chess-game-collection). chess_pgn_edit edits any game of a PGN holding several (game, 0-based, the first by default; cut as chess_games and the app's Open PGN… cut them, at most 256), returns that game only with games, how many the PGN holds, and refuses an index past the last."


