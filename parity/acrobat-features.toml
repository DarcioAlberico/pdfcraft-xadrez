notes = "Delete (2026-10-24, plan/borracha-e-faca.md A4): Delete or Backspace removes the selected objects as one undo step (Edit::DeleteObjects, Delete objects; headless object_delete with the same references and generation check as object_move): a paragraph's lines are taken out of their text with the text around them in place, an image's or Form's drawing is removed, added content goes with its stream, and a bad or stale reference refuses the whole deletion. Same-page mixed selection (#844): Shift/Ctrl/Command-click toggles, empty-space marquee (additive with modifiers), drag previews and one atomic undo step for existing paragraphs, Image/Form XObjects and added text/images. Source glyph bytes, fonts and kerning retained; unselected text and shared Form resources stay put. Generation-scoped references with optional automation guard; count and geometry bounded; unsupported vertical/clipping text refused without partial changes. Still missing: arbitrary paths, inline images, cross-page movement, group resizing, arrange/align and a general object editor. See docs/editing-multiple-objects.md."

[[feature]]
id = "edit.erase-content"
title = "Erase a page's content under an area (content eraser)"
area = "C"
tier = "P2"
milestone = "none"
status = "partial"
commands = ["edit.erase"]
tools = ["page_erase"]
evidence = ["crates/redact/src/tests.rs::the_eraser_clips_an_image_it_only_partly_covers", "crates/redact/src/tests.rs::erase_takes_the_area_away_draws_no_box_and_saves_incrementally", "crates/redact/src/tests.rs::the_centre_rule_takes_what_a_selection_shows", "crates/redact/src/tests.rs::erase_takes_only_the_kinds_asked_for_and_the_preview_lists_them", "crates/redact/src/tests.rs::erase_leaves_comments_and_fields_unless_asked", "crates/redact/src/tests.rs::erasing_a_shared_form_leaves_the_other_page_alone", "crates/redact/src/tests.rs::erase_refuses_bad_areas_and_empty_ground", "crates/automation/tests/automation.rs::erasing_content_through_tools", "crates/ui-egui/tests/erase.rs::a_box_drawn_with_the_eraser_erases_what_lies_under_it", "crates/ui-egui/tests/erase.rs::a_box_over_a_drawing_erases_the_drawing", "crates/ui-egui/tests/erase.rs::dragging_across_text_with_the_eraser_erases_the_selection", "crates/ui-egui/tests/erase.rs::choosing_the_eraser_with_text_selected_erases_it", "crates/ui-egui/tests/erase.rs::the_box_previews_what_will_go_before_letting_go", "crates/ui-egui/tests/erase.rs::the_brush_erases_what_it_rubs", "crates/ui-egui/tests/erase.rs::the_selection_bar_erases_the_selected_words", "crates/ui-egui/src/erase_ui.rs::erase_prefs_round_trip_and_ignore_bad_values"]
notes = "Beyond Acrobat, which erases with Delete in Edit PDF or with Redact (plan/borracha-e-faca.md A2, decisions D1-D3). pdfcraft_redact::erase removes what lies under areas of one page with redaction's interpreter, without marks or boxes: glyphs cut out of their lines with the rest in place, images removed or their covered pixels cleared, paths removed or clipped, form XObjects rewritten as copies so other pages keep theirs, and a verification pass after. Options: text, images, vectors (all by default) and annotations (comments, links and fields there; off by default, the comment eraser is for those); a glyph goes when its centre is inside (what a selection shows) or, as redaction, on any real overlap. An ordinary edit (Edit::EraseContent, Erase content), undoable and saved incrementally: the earlier revision keeps the content until a full save, so it is no secure removal (redact for that). erase_preview lists the boxes of what would go without changing anything. Headless: page_erase (rects in points from the top-left of the displayed page, kinds, rule; returns erased). In the app (A3): Edit a PDF ▸ Eraser (edit.erase) works as the Redact tool does: a drag across text selects it and letting go erases the selection, a drag elsewhere draws a box and erases what lies under it, each one undoable step (Erase content); choosing the Eraser with text selected erases it at once; the Edit panel picks what goes (text, images, drawings and shapes, comments with links and fields) and says that erasing is no secure removal. The comment tool is now the Drawing eraser (decision D4). 2026-10-25: what will go is tinted red while the box or the brush is drawn (erase_preview, cached per area); a Brush mode rubs squares of the chosen size (2-40 pt) along the pointer, one edit on release; the text selection's action bar has Erase; the choices (kinds, rule, box or brush, size) are kept between runs. An image the eraser only partly covers is clipped, whatever its codec (2026-10-25): its data stays in the file, shared as before; the eraser used to take redaction's way, clearing the pixels of a Flate image into a copy and removing a JPEG, JPX, JBIG2 or CCITT image whole, so erasing a corner of a scanned page wiped the page. Redaction still clears or removes. Missing: Delete on selected objects in Edit text and images (A4), vertical-writing text (refused, as in redaction), and fonts without reliable widths are measured as redaction measures them."

