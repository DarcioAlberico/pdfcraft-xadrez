notes = "An extension, not an Acrobat parity claim (fork decision D3). Diagrams are found in embedded images, page contours, chess diagram fonts and vector-drawn boards, merged and put in one reading order, then read into FEN with legality, side to move, orientation, the weakest square's confidence, uncertain squares and repairs; a lichess analysis URL is given only for legal positions the decoder did not repair. Diagram fonts are read exactly without a model; everything else needs the user's own piece model (none ships; chess_status says loaded, missing or invalid and why). Headless: chess_detect, chess_read, chess_status and pdfcraft-cli chess scan. In the app (S16a): Chess ▸ Scan chess diagrams and the Chess diagrams panel scan this page or all pages in the background, outline each diagram on the page coloured by state (read, needs review, not read) with its number, and list them (plan A8 P2a1, 2026-10-28, crates/ui-egui/src/chess_list.rs: filter chips with each state's icon and count, All 548 · Read · To review · Verified · Corrected · Not read · With an error, one state at a time, and On this page; Follow the page keeps the page on screen at the top of the list; a header per page, 'Page xvii · 25 of 703' when its printed number is not its place, that goes to it; a 32-point row per diagram with its state's icon, 'Diagram 1' and the state's name, and ⋯ on hover, selection or keyboard focus and as the row's context menu, with Open on the board, Copy FEN and Open in lichess; the FEN is in the row's tooltip and its menu only; the list is virtualised, its height taken by prefix sums over header, note and row heights in the panel's scroll area and only the rows in sight built: 2,000 diagrams add 0.22 ms to a frame, measured on an AMD Ryzen 5 8400F by an ignored test; with the keyboard on a row, Up, Down, Home and End go to another diagram across the whole list, Tab goes to its ⋯ and Enter opens it). The panel's header (plan A8 P2a2, crates/ui-egui/src/chess_panel_head.rs): Detect diagrams ▾ (the whole book, with its page count, or this page), then Export… (file-output), the chess board (layout-grid) and ⋯ (Chess models…), made left to right so Tab meets them as seen; while a scan runs, 'Detecting… page 75 of 703' kept at the width of its longest number, a 4-point progress bar and × Stop (those found stay); after it, '548 diagrams · 40 to review' with Review now, which opens the first diagram to review in the Diagram tab; before any scan, what detecting does. Headless (P2a2): chess_diagram_states counts the diagrams by state (read, review, verified, corrected, unread, error; to_review, per page), with the corrections kept in store unless corrections is false, by the same rule as the panel (pdfcraft_engine::chess::corrections::Status, which the panel's DiagramState now maps from); the list and the boxes follow the document's edits (plan A8 P3b4, below). Where the models come from (wave 10 U4, crates/ui-egui/src/chess_models.rs): Chess models… (the Diagrams tab, the chess.models command, Preferences ▸ Chess models) picks the models folder on the desktop, checks it at once (each model loaded, missing or invalid with the reason) and keeps it in the settings (chess_models: an empty, relative, over-4,096-byte or NUL-bearing path is ignored); models are looked for in that folder, then $PDFCRAFT_MODELS, then beside the executable (ChessModels::locate), a folder that is gone or holds no model giving way to the search with a note in Preferences; Check again reloads it (engine reload_models: a scan running keeps the Arc it started with). On the web it picks the four files (each read up to 64 MB), builds the models from their bytes (ChessModels::from_files) and installs them for the session (engine install_models); nothing is kept between visits (the browser storage the app has is too small). Beside the page (S16, S17): the Chess diagrams panel's Text tab shows the page read as chess text (ocr.chess-text); its editor corrects the selected reading (pieces placed from a palette, the model's second reading of an unsure square one click away, side to move, castling (a right the pieces no longer allow is taken off), move number, legality said at once and, when not legal, why: the first rule broken, such as a missing king, two kings, the side not to move in check, a pawn on the back rank, castling rights a moved king or rook no longer allows or an en-passant square that does not fit (plan A8 P3b1, 2026-10-25; the set-up and the board say it too, and chess_game's and the lichess links' refusals name it)) and Redraw in the PDF… draws the corrected position over the diagram as one undo step (edit.chess-replace-diagram); the review queue (the diagrams that did not pass the gate, repaired ones included, those the model could not read and those not read) can be listed alone and walked in reading order with Previous to review and Next to review, its count shown. Missing: a board divided by a rule along a file into two positions (Nimzowitsch, Meu Sistema, diagrams 57 and 58: each half is read right, but the board holds two kings a side, which the one-king repair turns into one and the gate refuses), whole-board preprocessing beyond the hatch retry (a board the gate refused whose dark squares are hatched or stippled is read again with its empty dark squares painted flat, and kept when the gate accepts it: 86 -> 95 of 113 labelled field-set boards exact, Reinfeld 1977 0 -> 60 of 106 diagrams accepted, read_bench and 38 books unchanged; deskew, flat-field and CLAHE are written but change no reading, so they are off, and pieces on hatched squares are still misread: Euwe and Kramer 1956, 1958), reading the printed coordinates (they are cut off now: a warped board is also cut to the 8 x 8 grid that alternates most, each side moved within 12% of the crop to the highest checker contrast and kept when it beats the whole crop by 0.05, so a frame, the paper inside it and the a-h / 1-8 printed beside the board no longer shift the 64 cells, 2026-10-24: field set 95/94/1 -> 98/98/3 exact/accepted/accepted but wrong, one of the two new wrong ones a label error, read_bench unchanged, 38 books 25,247 -> 25,250 valid moves and 850 -> 875 of 1,097 diagrams accepted, 11 moves lost on a contour that straddles two diagrams; Chernev's Capablanca is cut right but its pieces on hatched squares still keep all 7 boards from the gate; the coordinates are not read, so Black's point of view is told by the pieces instead, 2026-10-22: at least two more pawns on the other side's starting rank than on their own, a king on the far back rank and a legal position once turned, and the reading is then turned square by square and flagged printed_from_black; 3 of 5,457 labelled boards printed from White's side would be turned, all endgames with pawns about to promote, and read_bench stays 555/569; on 38 books it turned 39 diagrams, all in Carsten Hansen's Chess Tactics 2 and 4 and Workbook 1, and valid moves went 22,889 -> 23,146, Chess Tactics 2 124 -> 362 of 362). Accuracy is the user's model's: 555/569 exact (0.9754) on the prototype's test split as it stood in October 2026 (its splits.csv now holds 1,170 test boards: 1,145 exact, 1,149 accepted, 10 of them wrong, 2026-10-24), below the 0.99 target; the contour detector's recall is 0.9826 at 220 dpi on the prototype's field set. Plan A8 P1a (2026-10-26): the states' colours are theme tokens, light and dark (success, warning, danger with their text and soft fills, and attention for doubted squares; each state's text reads at 4.5:1 on every panel and on its soft fill, tested), and a diagram's state is one type (read, to review, not read, with an error, verified, corrected) with its Lucide icon, name and hint: the Chess diagrams panel shows the icon beside each diagram's words, never colour alone; the editor's doubted squares are outlined in attention, and the board, editor, set-up, capture and Text tab colour their states from the tokens. The pills draw a 2-point accent ring while they have the keyboard focus. Plan A8 P3a2 (2026-10-28): a page's scan lasts across edits while its content key stays the same (a hash of the page dictionary, every object it reaches with each stream in full, the attributes it inherits and the catalog's optional content and form drawing entries), so an edit, undo or redo reads again only the pages it touched, a page moved by inserting or removing pages is found at its new index, and a scan finished after an edit keeps the pages it did not touch; turning page 5 of a 703-page book reads 1 page again. A page nested deeper than 96 objects, or reached after 200,000 objects were hashed for the document's state, has no key and is read again after any edit. Plan A8 P3b4 (2026-10-28): the Chess diagrams panel keeps its list across an edit, undo or redo (Session::chess_carry): each page scanned is followed to where its content is now (pages inserted or removed before it move it; pages that draw the same are paired in order), what the cache holds for the pages whose content did not change is shown at once, and only the pages the edit changed are scanned again, in the background and without a word; a whole-book scan covers every page after the edit. The diagram picked, the one in the editor and the drafts follow their pages, and a page removed takes its diagrams, its editor and its drafts with it. A scan running across an edit is carried when it ends. The marks on the page (plan A8 P2b): a 1.5-point stroke in the state's colour at rest, an 8 % fill and the hand cursor under the pointer, a 2.5-point stroke with a 2-point accent ring when selected, the number in a tab outside the box (above it, below a box at the top of the page) with the state's 10-point icon, in the state's text colour on its soft fill (4.5:1, the theme's tests); a click picks a diagram with the Hand too, a drag with it only pans. Mark the page as checked (the page header's context menu in the list, and the chess.verify_page command for the page shown) keeps every diagram of the page read with confidence and not confirmed yet as Verified, never those to review, not read or with an error (the plan rejects accepting them in bulk), and says how many it checked and how many are left to review; headless, chess_page_verify does the same and says why each other diagram was left (kept, review, unread, error). Navigation (plan A8 P4): the Diagram tab's arrows, Page Up / Page Down and Confirm and next walk the diagrams the list's chip shows (with no chip, the ones to review), the counter named for it ('12 of 40 to review', '3 of 12 · Corrected'); going round from one end to the other is said (Back to the first diagram); confirming the last one to review says Review done: 40 of 40 checked, in the tab and as a notice, instead of moving on; opening a diagram on the board puts its page on the view history (Alt+← comes back to it after scrolling away), and the board's title links Back to diagram 3 (page 17), which opens it again in the Diagram tab. A diagram is numbered by its page everywhere (the list, the marks, the tab, the board's link and what screen readers hear: Page 17 · diagram 1 of 2, then its place in the walk). Missing: filtering by more than one state at once; screenshots of the marks; of two pages that draw exactly the same, when one is removed it cannot be told which (the editor on it may stay on the other). Plan A8 P10, wording (2026-10-29, §2.2): castling is written out in the Diagram tab, the classic editor and the set-up (Castling — White: short, long · Black: short, long; each box named in full for screen readers, White short castling…); a second reading's button says what it puts (Change to: White bishop, or Empty the square); Back to the reading is Restore the automatic reading; Copy FEN says what a FEN is (Position code other chess programs accept.); in Portuguese, Chess models… is Modelos de leitura…. The review journeys of the plan (§5) are measured gesture by gesture at 1366 × 768, all on target (docs/chess.md, Measurements)."

