evidence = ["crates/engine/src/chess/corrections/tests.rs::a_file_round_trips_and_bad_or_newer_files_are_told_apart", "crates/engine/src/chess/corrections/tests.rs::the_same_diagram_gets_a_new_revision_and_another_a_new_entry", "crates/engine/src/chess/corrections/tests.rs::merges_take_the_higher_revision_and_never_bring_a_deletion_back", "crates/engine/src/chess/corrections/tests.rs::diagrams_are_found_by_fingerprint_and_overlap", "crates/engine/src/chess/corrections/tests.rs::a_document_is_known_by_any_of_its_keys", "crates/engine/src/chess/corrections/tests.rs::normalised_boxes_and_overlap", "crates/engine/src/chess/corrections/tests.rs::page_fingerprints_survive_saving_and_follow_the_pages", "crates/engine/src/chess/corrections/tests.rs::the_folder_store_writes_finds_and_keeps_two_writers_changes", "crates/engine/src/chess/corrections/tests.rs::unreadable_files_are_set_aside_and_newer_ones_never_written", "crates/engine/src/chess/corrections/tests.rs::the_memory_store_keeps_files_within_its_budget", "crates/automation/tests/chess.rs::diagram_corrections_are_kept_found_again_and_confined", "crates/engine/src/chess/corrections/tests.rs::a_correction_replaces_its_diagrams_reading_whatever_it_reads_now", "crates/engine/src/chess/corrections/tests.rs::a_correction_without_its_diagram_is_listed_never_dropped", "crates/engine/src/chess/corrections/tests.rs::saving_moves_the_corrections_to_the_saved_files_keys", "crates/automation/tests/chess.rs::corrections_win_in_readings_exports_and_links_and_are_never_lost", "crates/ui-egui/tests/chess.rs::confirming_keeps_the_correction_and_it_comes_back_when_reopened", "crates/ui-egui/tests/chess.rs::a_reading_confirmed_as_it_is_is_verified", "crates/ui-egui/tests/chess.rs::saving_as_keeps_the_corrections_for_the_saved_file", "crates/ui-egui/tests/chess.rs::the_classic_editor_stays_in_the_diagrams_panel", "crates/ui-egui/tests/chess.rs::the_editors_labels_are_not_broken_into_letters", "crates/ui-egui/tests/chess.rs::a_draft_is_kept_per_diagram_and_marked", "crates/ui-egui/tests/chess.rs::closing_with_a_draft_asks_first", "crates/ui-egui/tests/chess.rs::exporting_with_a_draft_confirms_it_first", "crates/ui-egui/tests/chess.rs::detecting_again_asks_about_drafts", "crates/ui-egui/tests/chess.rs::the_first_time_hint_goes_once_put_away", "crates/ui-egui/tests/chess.rs::the_diagram_tab_corrects_and_confirms_by_the_keyboard_alone", "crates/ui-egui/src/chess_diagram_keys.rs::each_key_puts_one_piece", "crates/ui-egui/src/chess_diagram_keys.rs::the_board_takes_only_its_own_keys", "crates/ui-egui/src/chess_diagram_keys.rs::the_keys_edit_and_the_editor_undoes_step_by_step"]
notes = "An extension, not an Acrobat parity claim (fork decision D3); plan A8 step P3a1 (docs/chess/plano-analise-8.md). The store only: pdfcraft_engine::chess::corrections keeps the corrections a user makes to diagram readings in one JSON file per document (format pdfcraft-chess-corrections, version 1; at most 20,000 entries and 4 MB), named by a hash of the document's keys (DocKeys: /ID[0], else the path, else name and size) and found again by the document recorded in each file, so saving (which may add an identifier and changes the size), renaming or moving it keeps them. Each entry has a uid, the page and its fingerprint (a hash of the page's content streams and images as stored, which saving keeps), the diagram's box as fractions of the crop box, the reading it replaced, the position (a full FEN), its kind (verified or corrected), when and a revision. The same diagram is the one whose box overlaps by an intersection over union of 0.7 or more on the same page; a page moved by inserted or removed pages is found by its fingerprint (located same, moved, changed or orphan). Two copies merge entry by entry, the higher revision winning; deleting leaves a tombstone so a merge never brings it back. The file keeps no text or picture of the document and its path only as a hash. A file of a newer version is shown read only and never written; one that can't be read is set aside as .bad, never deleted. Kept through the CorrectionStore trait: DirStore (desktop and command line; read, merged and written under a lock file in the folder, through a staging file renamed over it, so two writers keep both changes) and MemStore (the web build, within a byte budget of its own, apart from the autosave's). Headless: chess_correction_list, chess_correction_set (scans the page, keeps diagram index as corrected with fen or verified with the reading) and chess_correction_delete, the folder confined to --root (.pdfcraft/chess-corrections by default). Used (P3a3): Session::set_chess_corrections gives a document its corrections (forgotten when it is closed) and Session::chess_scan_corrected puts them in place of the readings they correct (corrections::apply: each correction takes its page's diagram overlapping it most, by 0.7 at least, one diagram each; the person's position wins whatever the diagram reads as now, read_by user, accepted when legal with its side to move, Black's point of view kept for the link; a reading changed since the correction was made over it is noted on the page; a correction whose diagram is not on its read page, or whose FEN can't be read, is listed as unmatched and noted, never dropped silently). The recognised document (chess_document_with), every export (HTML, EPUB, Word, RTF, Markdown, PGN) and the lichess links read through it, so a corrected diagram is drawn, linked and starts its games from the corrected position, and an unread diagram that was corrected gets a position. chess_document, the chess_export_* tools and chess_add_lichess_links load doc's corrections from store (corrections: false reads without them) and reply with what was loaded, applied (with what it reads as now and diverged) and unmatched. Saving follows them: after doc_save the corrections in the default folder are recorded under the saved file's keys (CorrectionStore::rekey), so Save As takes them to the new file, as the game collection follows its document (the original file, if opened again, no longer finds them). Tested end to end: corrected, then an inserted page, its undo, a Save As, closing and reopening, each reading the corrected positions. In the app (P3b2): the Diagram tab (crates/ui-egui/src/chess_diagram_tab.rs, docking::Panel::Diagram) opens between the page and the Inspector, 320 pt wide, when a diagram is picked in the Diagrams list (picked on the page it comes forward only when open already, so the page does not move under a double-click); a saved layout without it opens it there. Header: the diagram's state icon, 'Page 17 · diagram 1 of 2' (shows it on the page), Analyze on the board, and the review queue ('12 of 40 to review', chevrons, Page Up / Page Down with the keyboard in the tab or the pointer over it). Body: the board (the tab's width less 24 pt, its height less 204 pt, 200 to 420 pt), the palette in two rows under it, To move, Move number, Details (castling, the FEN, Flip board, Back to the reading) and the model's second readings. Footer, fixed: the legality chip (why not, when illegal), ⋯ (Redraw in the PDF…, Add lichess link, Copy FEN, Open in lichess, Forget the correction) and Confirm and next ▾ Only confirm (Ctrl+Enter), the last choice remembered; Confirm keeps the position as Verified when it is the reading, else Corrected, without changing the PDF. The Diagrams list and the marks on the page show Verified and Corrected, a confirmed diagram leaves the review queue, and a confirmed diagram opens on the position kept for it. The store: the desktop's recovery folder (chess/corrections, beside the autosaved games), the web's eframe Storage (pdfcraft-chess-corrections-v1, 1 MB of its own), memory for the session otherwise; each document's corrections are given to the session when its scan is kept, so the Text tab, the exports and the links use them, and saving (as itself or as another file) records them under the saved file's keys. Preferences ▸ Classic diagram editor keeps the editor in the Diagrams panel (for one version). Drafts (P3b3, crates/ui-egui/src/chess_drafts.rs): leaving a diagram with changes keeps them as its draft for the session, shown again when it is opened; a draft is a warning dot on the state icon in the list, on the page mark and in the tab, which says Unconfirmed changes. Closing the document, Close all, quitting, exporting the book and detecting again over a document's diagrams ask about each draft first (Keep the correction of diagram 1 (page 17)? Squares changed: 2. Not confirmed yet.): Confirm correction keeps it as Confirm does, Discard changes drops it, Keep editing (or Esc) stops there and opens it; once none is left, what waited goes on. The tab's first-time hint (click a square; Confirm keeps the correction without changing the PDF) shows until put away or a diagram is confirmed, kept with the preferences. The Text tab's reading and the exports run in a session of their own, which now gets the document's corrections too (it did not in P3b2: the app's exports read the uncorrected positions). By the keyboard and for screen readers (plan A8 P3c, 2026-10-28, crates/ui-egui/src/chess_diagram_keys.rs): the board is one Tab stop and has the keyboard when a diagram opens and after a confirmation; the arrows move a cursor over its squares as shown (stopping at the edges), a piece's letter in the interface's notation puts it there (R D T B C P in Portuguese, K Q R B N P in English, with Shift Black's; a language whose letter is not one Latin letter takes English's unless another piece has it, so the Dutch pawn has no key), Delete, Backspace or Space empties the square and Enter puts the palette's piece as a click does; while the board has the keyboard every letter is its own, so no tool's one-letter shortcut nor Space for the Hand fires. The board is a grid for screen readers (Diagram board: <FEN>, its value the square under the cursor, 'e4, White knight'), each square a cell of its own named the same and the cursor's its active descendant. With the keyboard in the tab (or the pointer over it): Ctrl+Enter confirms and goes on, Ctrl+Z and Ctrl+Shift+Z undo and redo the editor's changes (up to 200; a run of move-number changes is one; the document's Undo when the editor has none, and after Redraw in the PDF, so Ctrl+Z takes the drawing back), and Esc gives the keyboard to the diagram's row in the Diagrams list, discarding nothing. The keys leave the input in raw_input_hook, before egui moves the focus on the arrows and before the app's shortcuts. Tab goes ⋯ → Confirm → ▾ in the footer (they were made right to left before). Opening a diagram tells screen readers which one, politely (a live status: 'Diagram 4 of 40 to review, page 18, 2 doubtful squares'). Missing: drafts kept across sessions, the progress of a scan said every 10%, the palette as one Tab stop (each piece is one; egui's arrows move between them), the cursor in the analysis board's set-up, the divergence shown in a tooltip, the tab in the chess window, the web build not run in a browser; fingerprints are made on the interface thread after each edit (all pages)."

[[feature]]
id = "view.chess-detached-window"
title = "Move the chess board and the Chess panel into a window of their own and back"
area = "I"
tier = "P2"
milestone = "none"
status = "partial"
commands = ["chess.window.detach"]
tools = []
evidence = ["crates/ui-egui/tests/chess.rs::the_board_moves_to_its_own_window_and_docks_back_where_it_was", "crates/ui-egui/tests/chess.rs::read_mode_shows_the_board_only_in_its_window", "crates/ui-egui/tests/chess.rs::the_window_and_its_size_come_back_and_bad_values_are_ignored", "crates/ui-egui/tests/chess.rs::a_wide_window_has_a_larger_board_beside_the_diagrams", "crates/ui-egui/tests/chess.rs::the_chess_panel_moves_to_the_window_and_the_inspector_says_so", "crates/ui-egui/tests/chess.rs::a_narrow_window_switches_tabs_and_follows_the_diagrams_picked_on_the_page", "crates/ui-egui/tests/chess.rs::the_windows_tab_comes_back_and_old_or_bad_values_open_on_the_board", "crates/ui-egui/src/chess_window.rs::a_window_without_a_surface_docks_back_once_with_a_notice", "crates/ui-egui/src/chess_window.rs::another_windows_surface_failure_leaves_the_board_out", "crates/ui-egui/src/chess_window.rs::saved_settings_round_trip_and_bad_values_are_ignored", "crates/ui-egui/src/chess_window.rs::the_board_grows_with_the_window_and_sits_beside_the_moves_when_wide", "crates/ui-egui/src/chess_window.rs::random_saved_settings_never_panic_and_only_usable_values_are_kept", "apps/pdfcraft/src/main.rs::egui_wgpu_records_a_window_whose_surface_it_could_not_configure", "crates/ui-egui/tests/chess.rs::docking_back_returns_the_board_to_its_group_without_covering_the_inspector", "crates/ui-egui/tests/chess.rs::the_embedded_window_keeps_the_inner_size_as_the_native_one_does", "crates/ui-egui/tests/control.rs::ui_state_reports_the_chess_windows_geometry", "crates/ui-egui/src/chess_window.rs::the_size_kept_is_the_inner_size_native_or_embedded", "crates/ui-egui/src/window_place.rs::a_saved_place_comes_back_on_its_monitor_and_moves_with_it", "crates/ui-egui/src/window_place.rs::a_place_off_every_monitor_opens_beside_the_main_window_fully_visible", "crates/ui-egui/src/window_place.rs::bad_saved_values_are_ignored_and_nothing_panics", "crates/ui-egui/src/window_place.rs::a_window_place_is_measured_in_pixels_of_the_desktop"]
notes = "An extension, not an Acrobat parity claim (fork decision D3); PGN toolbar spec steps T13a and T13b (D8 b, the whole Chess window). chess.window.detach (labelled Chess in its own window: the PGN rail's Own window tool and the Board tab's context menu, only where native windows can be opened) moves the Board panel into a native window (an egui immediate viewport drawn every frame, before full screen returns) and back; its dock slot collapses and keeps its place (a hidden Location), the Read-mode board panel is not drawn meanwhile, and opening a diagram on the board brings the window forward instead of docking it. Closing the window or its Dock button docks the board where it was (U5): in its tab group, at its place in it, in front only if it was in front when it left; the Inspector's Bring it back docks it the same way but leaves the Inspector in front (its Chess panel shows the Diagrams and Text again), and a board whose group is gone goes at the end of the Inspector's group. The window also holds the Inspector Chess panel's Diagrams and Text tabs (T13b): from 760 pt wide the board panel is on the left and Diagrams or Text on the right (a 300-560 pt column), narrower a Board | Diagrams | Text strip shows one at a time; the window opens 960 x 760 pt, wide. While it is out the Inspector's Chess panel says the chess panel is in its own window, with a Bring it back button that docks it, so the tabs are never drawn twice in a frame (the window records that it was drawn this frame); the Study board tab that stayed in the Inspector merged into the board in T5c. Picks keep working with the window out: a diagram clicked on the page is selected in the window's list (a narrow window on the board switches to Diagrams; the Inspector is not opened), a scan shows the window's Diagrams, a double-click or Open on the board shows the window's board, and the Text tab's moves still outline on the page. In the window the 480 pt board cap is lifted (up to the window's height under the controls, at most 1,200 pt, a picture of up to 2,048 px at the screen's pixel density) and from 760 pt of board column the board sits left of the moves, notes and fields. The window's keys are its own: the chess keymap is taken from them for its rail, then the app's shortcuts run there. Saved in settings as docking_detached {detached, size, place, docked_front, tab} (tab board, diagrams or text; settings without it, from T13a, open on the board). size is the inner size in points, what the contents get, for the native window and the embedded one alike (the embedded window's frame and title bar are measured and added; a first window made with a wrong estimate of them is made again once), so switching between them keeps it (U5). place is the native window's outer rectangle in physical pixels of the desktop, its scale and the monitor it was on, read from winit through eframe's main window (window_place.rs): it comes back on that monitor, moved with it if the monitor moved, else on the monitor most of it is on if 48 x 48 pt of it are, always moved and shrunk to lie wholly on it; otherwise it opens beside the main window (right, else left, else over its right part) on the main window's monitor, or inside the main window when no monitors are known; a window that the system made at another monitor's scale is moved to its place once after it opens. Bad values are ignored one by one (fuzzed with random JSON for the whole value, each field and each field of place: what is kept is always a size within the limits, a place of finite pixels within 65,536 with a scale of 0.25-8, and where the window would open is always wholly on a monitor); a position saved before U5 is not used. ui.state reports chess_window (detached, embedded, size, place, opened_at, monitors, and shown: outer rectangle, pixels per point, monitor scale and size, outer rectangle in pixels) so the two-monitor check can be recorded by script. Failures dock the board back once with a notice and no window opens again that session: a window or GL surface the backend could not create (egui's panic caught by guard), a wgpu surface that could not be configured (recorded by the patched egui-wgpu, take_surface_failures; the fonts are installed again for a full atlas upload and the board's pictures and icons reloaded), or the board's code panicking inside the window's pass. Where windows are drawn inside the main one (the web, kittest, the shot example) nothing offers it; a window restored from settings is the app's own egui::Window with a Dock button, first placed on the right over the Inspector, never egui's fallback, which panics. Engine analysis repaints at most ten times a second. Missing: the recorded check on the real executable across two monitors with different scaling (1920 x 1080 at 100% and 3440 x 1440 at 150% on the development machine; the rules are unit-tested with those monitors, and ui.state chess_window plus the system's screenshots are the way to record it, since the control channel's screenshot can't capture the child window); monitors are not known on the web or where winit can't list them (the window then opens inside the main window); the outer size used to fit a window on its monitor is the inner size plus an estimated frame (16 x 40 pt)."

