evidence = ["crates/chessvision/src/glyphs/tests.rs::a_frame_around_text_is_no_glyph_and_its_text_is_read", "crates/chessvision/src/glyphs/tests.rs::a_fragment_over_its_letter_is_joined_to_it", "crates/chessvision/src/glyphs/tests.rs::a_u_before_a_square_is_the_captures_x", "crates/chessvision/src/doc/tests.rs::a_bracket_inside_a_word_is_no_variation", "crates/chessvision/src/glyphs/tests.rs::a_box_with_a_drop_shadow_is_a_frame_and_its_text_is_read", "crates/chessvision/src/glyphs/tests.rs::a_bolder_line_standing_alone_is_a_heading", "crates/engine/src/chess/tests/text_ocr.rs::a_bolder_title_standing_alone_on_a_scan_is_a_heading", "crates/engine/src/chess/tests/text_ocr.rs::a_framed_header_on_a_scan_is_a_heading", "crates/engine/src/chess/tests/text_ocr.rs::a_larger_title_on_a_scan_is_a_heading", "crates/engine/src/chess/tests/text_ocr.rs::larger_lines_are_the_titles_over_the_body", "crates/engine/src/chess/tests/text_ocr.rs::larger_lines_join_into_titles_and_a_column_beside_them_is_kept_out", "crates/chessvision/src/glyphs/tests.rs::a_lines_height_is_its_capitals_whatever_it_holds", "crates/engine/src/chess/tests/text_ocr.rs::a_boards_border_beyond_the_mask_goes_with_what_it_holds", "crates/engine/src/chess/tests/text_ocr.rs::a_box_around_a_board_and_its_moves_keeps_the_moves", "crates/chessvision/src/glyphs/tests.rs::a_letter_cut_at_its_hairline_is_merged", "crates/chessvision/src/glyphs/tests.rs::an_upright_rule_is_not_a_character", "crates/engine/src/chess/tests/text_ocr.rs::a_diagram_is_painted_out_with_its_frame", "crates/chessvision/src/doc/tests.rs::a_piece_of_a_row_beside_a_narrow_board_is_read_before_it", "crates/chessvision/src/chess_text/tests.rs::a_stray_mark_inside_a_square_is_dropped", "crates/engine/src/chess/tests/text_ocr.rs::a_scanned_page_is_read_by_chess_ocr_and_its_moves_replay", "crates/engine/src/chess/tests/text_ocr.rs::without_a_glyph_model_or_with_ocr_off_the_page_needs_ocr", "crates/engine/src/chess/tests/text_ocr.rs::ocr_words_join_the_g