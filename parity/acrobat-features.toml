[[feature]]
id = "view.view-history"
title = "Previous view / next view"
area = "B"
tier = "P1"
milestone = "M3"
status = "shipped"
commands = ["view.previous_view", "view.next_view"]
tools = []
evidence = ["crates/ui-egui/tests/viewer.rs::view_history_select_all_and_find_options", "crates/ui-egui/tests/control.rs::navigation_history_commands_and_rail_are_per_tab_and_non_editing", "crates/ui-egui/tests/control.rs::routine_continuous_scrolling_does_not_add_navigation_history", "crates/ui-egui/tests/viewer.rs::alt_arrows_walk_the_history_not_the_pages", "crates/ui-egui/tests/viewer.rs::a_shortcut_does_not_fire_with_an_alt_it_does_not_name", "crates/ui-egui/src/commands.rs::view_keys_and_command_shortcuts_never_collide", "crates/engine/src/commands.rs::alt_is_written_and_counted"]
notes = "Per-tab page history: explicit search-result jumps, page navigation, bookmarks and links; no continuous-scroll history or restart persistence; existing page-step history is retained. Rail buttons, View ▸ Page navigation and Ctrl/⌘[ / Ctrl/⌘]. UI control ui.command exposes view.previous_view / view.next_view; standalone engine sessions have no viewport history. Restores page tops, not exact scroll/zoom positions. Alt+← and Alt+→ walk the view history too, as a browser's, and no longer turn the page (plan A8 P1c, 2026-10-26; before, Alt+→ turned it). Shortcut gained alt: a registered shortcut fires only with the Alt it names (Ctrl+Alt+H is not Ctrl+H), Alt is written (Alt+←, ⌥←) and counted, and a test keeps the view's own keys and the commands' apart. Missing: the chess panel's own keys share the scope table of chess_tools, outside this one."

[[feature]]
id = "view.follow-links"
title = "Follow links and destinations"
area = "B"
tier = "P0"
milestone = "M3"
status = "shipped"
commands = []
tools = ["link_open"]
evidence = ["crates/ui-egui/tests/view.rs::clicking_a_link_goes_to_its_destination", "crates/ui-egui/tests/view.rs::link_destinations_scroll_to_their_position", "crates/render/src/inspect.rs::bookmarks_and_links_keep_their_destination_view", "crates/render/src/inspect.rs::links_read_bounded_local_remote_go_to_actions", "crates/automation/tests/automation.rs::local_gotor_link_open_applies_destinations_and_honors_root", "crates/ui-egui/tests/document_links.rs::a_local_gotor_link_opens_in_a_tab_and_applies_its_destination", "crates/ui-egui/tests/document_links.rs::an_absolute_gotor_waits_for_consent_and_keeps_its_destination_across_tabs", "crates/ui-egui/tests/document_links.rs::cancelling_an_absolute_gotor_by_button_escape_or_dismissal_changes_nothing", "crates/automation/tests/automation.rs::absolute_gotor_consent_does_not_bypass_validation_or_passwords"]
notes = "GoTo and URI links plus local-PDF GoToR links: source-relative or local absolute /F paths, /UF preferred in file-spec dictionaries, explicit numeric page/view destinations, and internal tabs. Absolute local GoToR targets require desktop Allow/Cancel confirmation or an explicit allow_absolute opt-in in link_open; relative links open normally. link_open honors --root. Named remote destinations open at default view with a warning; /NewWindow is a tab hint. URL/network file systems, GoToE, Launch and other actions are not executed. Same-document destinations retain their supported /XYZ, /Fit, /FitH, /FitV and /FitR views; /FitB* is read as whole-page fit."

