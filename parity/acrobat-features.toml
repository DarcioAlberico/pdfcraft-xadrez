notes = "An extension, not an Acrobat parity claim (fork decision D3). The Chess board panel is a docking tab beside the Inspector (and a side panel in Read mode). A diagram goes onto it by a double-click on the page, also on a page not scanned yet (2026-10-23): that page is scanned first, without bringing the Chess panel forward or announcing the count, then the diagram under the double-click goes onto the board; a double-click with no diagram under it says so, unless it selected a word (it may have been for that), and a document that forbids copying is not scanned that way, in silence. Its side to move and move number are those of the game the Text tab's reading of the page starts at the diagram (the first move's number, a position-after caption), when the pieces agree, else the reading's (the bold move number under it); a page the Text tab had not read is read for it once the diagram is on the board (2026-10-23, off the interface thread, after any reading running), and the side and number are applied if the game shown is still that diagram's, untouched, with no move played (nothing to undo); Open on the board in the Chess diagrams panel or its editor (the position as edited) puts it on the board and brings the Board panel forward (docked, or the chess window's board). Moves are played by click or drag (the piece follows the pointer) with legal targets, the last move and check marked; castling is the king's two-file step; promotion asks for the piece. The game is a tree: a move at an earlier point starts a variation; the move list shows variations, comments and glyphs, and a move's menu makes its line the main one or deletes it. The move shown takes glyphs (move quality, evaluation) and a comment; Game details edits the PGN tags. FEN and PGN fields follow the board and load back (variations, comments, NAGs and tags; an illegal move ends only its own line). Nothing replaces a game with moves unasked (plan A8 V2b, 2026-10-24): Enter with the FEN as shown does nothing, a FEN typed over moves asks New game (default) or Replace this game, Standard start position over moves is a new game, typed PGN text outlives steps on the board (PGN edited: Load / Discard) and loading the same game keeps the move shown and the moves' places on the page; the delete button beside the notation is gone (the move's menu deletes). Load PGN with several games in the field (2026-10-23) puts the first on the board (one undo step of the game) and adds the others, split at tag lines as Open PGN… splits a file and at most 256 games in all, to the document's games after the others, the game shown staying shown, as one undo step of the list (“Undo Load the PGN”, taken before the game's), and says how many (“2 more games were added to the list of games.”, with those not read and the cap). Headless: chess_game (from a FEN or PGN, moves in SAN or UCI, the position at a ply with its legal moves, the game as PGN). Rules are pdfcraft_chess::game (L0, cozy-chess), capped at 10,000 moves and 32 nested variations. Illegal diagrams are shown framed and cannot be played. A Move number field beside To move: (on the next row when the panel is too narrow; 2026-10-22) corrects the number the game starts at when the reading missed or misread it (Game::set_first_move_number: every move and variation is renumbered, kept within 1-999, the PGN's FEN tag follows; one undo step while it is typed in or dragged; the chess window's board has it too); headless, a FEN with the number does the same. Right-button drawings (circles and arrows in four colours) belong to the move shown (U7): each one is an undo step, and they are written into the game's PGN as [%csl]/[%cal] commands at the start of the move's comment (the ChessBase/lichess convention, G/R/Y/B), read back from any PGN with the rest of the comment, other [%…] commands such as [%clk] and [%eval] included, kept in place; an entry the board cannot draw (unknown colour letter or square, an arrow onto its own square, a second colour for the same squares, past 64 on a move) stays in the comment as text, and pgn → from_pgn → pgn stays a fixpoint (property-tested). Moving a piece no longer clears them (Clear drawings does); an illegal position, having no game, keeps its drawings beside it and writes them nowhere. The Board panel is the study board (PGN toolbar spec T5c, D11 b: the Chess panel's Study board tab is gone, and the panel's tabs are Diagrams and Text). The rail's Set up a position tool (chess.tool.setup, a mode: Esc, Cancel, Done or another game put on the board leaves it) puts the set-up view in the board's place: palette, start or empty board, side to move, castling fitted to the pieces, legality at once; Done plays from the position as one undo step; over a game with moves it is New game from this position (a new game after it in the list, ChessCollection::new_at) or Replace this game (A8 V2a). Its Analysis section under the board, closed until opened, has analysis by the user's own UCI engine on the desktop (PDFCRAFT_CHESS_ENGINE, an engine folder beside the executable, or picked with Choose engine…, which is remembered with the number of lines in the settings, chess_engine, validated on load (absolute path to an existing file, lines 1–3; a bad value is ignored on its own) and never starts analysis by itself; none ships): a thin evaluation bar beside the board, 1–3 lines with scores for White, the best move as an arrow, a click on a line's move plays the line up to it; the engine stops while the Board panel is not drawn in a frame (another tab in front of it, closed, Home mode; docked or in the chess window alike), stops at depth 30, drops lines about a position it was moved off, and sends the engine only FENs the rules wrote back. It keeps the lines of the last 64 positions it left, for the session (2026-10-23): back on one of them, or on the position it was stopped on while the board was hidden, it shows them at once and searches on, keeping them until the new search's best line is deeper; a position searched to depth 30 is not searched again; other options (the number of lines) drop what was kept and search the position shown again. The section also shows the material ahead (pieces and points), clears the drawings and says how they are drawn. Checked at 330 pt (rail, board with the bar, notation) with a pretend engine in a headless shot, and with Stockfish in the gated test. Missing: the engine is not offered as an automation tool (by design: a tool would let an MCP client run a program), drawing commands typed into the comment before a move that continues its line become the previous move's drawings once written to PGN and read back (PGN joins the two comments), no opening explorer or tablebase (nothing goes to the network), the lines kept for a position are not kept across sessions, and saving a game into the PDF. Preferences ▸ Chess pieces (plan HC2) picks the piece set from a grid of pictures: one for the boards (analysis, study) and one for diagrams, the editor and exports, each kept with the preferences and applied at once (every board picture is drawn again); offered are automatic, the shipped sets with author and licence, diagram fonts beside the executable and an installed Chess Merida, folders of piece images in the pieces folder beside the executable (one missing pieces says which and cannot be picked) and plain shapes; a set that cannot be used says why and plain shapes are drawn; PDFCRAFT_CHESS_PIECES still takes precedence and Preferences says so. chess_pieces lists the same sets with their tokens; the tools choose per call with pieces (installed, geometric or a shipped id), so a font or folder outside the shipped sets is not chosen headlessly yet. Import a folder… and Import from a web page… (plan HC3, 2026-10-25) put piece sets into the pieces folder beside the executable, one folder each: a folder of twelve piece images is copied, and a saved web page gives the sets it carries inside it (data:image/svg+xml values keyed wK to bP, plain or base64, found by searching its text: no HTML parser, no script run; a page that fetches its pieces from the web has none). Every piece is read by the same reader as the user's folders first (an SVG pointing at another file draws nothing and is refused), nothing is written unless all read, a set of the same name is replaced only after Replace, and each folder gets an ORIGIN.txt saying where it came from and that its licence is unknown, for personal use, as the interface says. Headless: chess_pieces_import (into a folder inside --root, needed when it is set). Missing: importing on the web build (no pieces folder there). Above the move list (plan HC10, 2026-10-25) the game's header names the players with their Elo, then the event, site, date (as far as it is known: 1962.??.?? is 1962) and round, each only when its tag says something (no ?), in one or two lines; a click opens Game details. The result (1-0, 0-1, ½-½ or *) follows the main line's last move, as books print it. Board themes (plan HC4, 2026-10-25): fourteen palettes of our own with generic names (brown, the colours before themes and the default; light wood, walnut, blue, ice blue, green, olive, grey, graphite, purple, pink, sand, coral, high contrast), each with its squares, last move, piece picked up, targets and check ring, in pdfcraft_chess::theme. They draw the analysis and study boards, the set-up view, the diagram editor and the piece picker's tiles, chosen in Preferences ▸ Board theme (a tile each), the board panel's palette menu or the control channel's board-theme, and kept with the preferences. The coordinates on the board read at 4.5:1 in every theme: their colour is the other square's, darkened or lightened until it does (brown's were 2.2:1 before); every mark stays plainly off both squares (tested per theme). Diagrams on the page, the Text tab's small boards and the exports keep brown until plan HC7; no headless tool chooses a theme yet (the exports' board_theme comes with HC7). How the boards are laid out (plan HC6, 2026-10-25), in Preferences ▸ Board theme, the board's palette menu and the control channel (board-coordinates, board-frame, board-squares, board-turn-dot), kept with the preferences: coordinates on the edge squares (as before), beside the board (ranks to its left, files under it) or none; no frame, a thin one or a book's double one; a square marked by hand as a ring (as before) or filled; and a dot on the side to move's edge. The squares move in to leave room, and clicks and drags still land on the square under them. Arrows take their width and opacity from the theme (high contrast draws them wider and more opaque). Missing: the same choices for diagrams drawn on the page and in exports (plan HC7). Textured themes (plan HC5, decision D14, 2026-10-25), made in code from fixed seeds and no one else's picture: wood (grain along the light squares, across the dark ones), marble (veins), paper (a fine grain) and book print (the dark squares hatched in diagonal lines, as printed diagrams). Wood, marble and paper are pixels from pdfcraft_chess::texture under the pieces (drawn on white and on black for their coverage), made once per theme and size: another position or a smaller board makes none (an 800-pixel board took 45 ms in a debug build). Book print is vector paths (BoardStyle::hatched), so diagrams can take it (HC7). Missing: the diagram editor, the set-up view and the picker's tiles draw wood, marble and paper flat in their colours. The move list writes the pieces (plan HC8, decision D15, 2026-10-25) as figurines drawn with the board's own piece set (a picture the text's height, so rows keep their height; the default), as letters in the interface's language (pt-BR Cf3, German Sf3, Russian Кр…, castling with zeros where the language writes it so) or as English letters, chosen in Preferences ▸ Board theme or the control channel's move-pieces and kept with the preferences; the game and its PGN do not change. Every move is named in words for assistive technology (knight f3, knight takes e5, e8 promotes to queen, check; castles short), in the interface's language. Missing: Copy line still offers its own two forms (figurines as Unicode signs, or English letters). chess_game returns the header the move list shows (header, with the result), read through the same Game::header as the interface. Marks on the moves (plan HC12, 2026-10-25): a move's quality sign (!, !!, !?, ?!, ?, ??) is a chip of its colour with the sign on it (green, strong green, blue, yellow, orange, red; each sign reads at 4.5:1 on its chip, never colour alone), its name on hover (the move itself is named with its sign); a move with drawings has a dot of each of their colours, named by them (2 arrows, 1 ring), and the pointer over it shows that move's drawings on the board without going to it; a comment before its move is set in, upright and fainter, apart from the comment on the move before. The comment on the move shown can be shown large under the board (Preferences, or the control channel's comment-focus), in the panel and the chess window. Missing: the dot's drawings show for the pointer only, not for the keyboard focus; a comment's line breaks are those the game keeps (it collapses spaces). The move list's layout and text size (plan HC9, 2026-10-26), in Preferences or the control channel (move-list-layout, move-list-size), kept with the preferences, in the panel, the list beside the page and the chess window alike: running text (as before) or columns (number, White, Black: a comment or a variation breaks the table and runs across it, and Black's move after a break starts a row of its own with …), in small, normal or large text. A 1,000-move game takes about 7 ms a frame in running text and 10 ms in columns in a debug build. Missing: only the rows in view are not drawn alone (the whole list is laid out each frame), so very long games cost more than the plan's 4 ms; A8 V3's tree (collapsing, a trail, forks) is not done. (Done by plan A8 V3, 2026-10-29: see below.) Variation to variation (plan HC11, 2026-10-26): Page Down and Page Up in the chess key scope, and two buttons beside the move arrows (off at either end), go to the first move of the next or previous variation in reading order, the order the notation writes them, into and out of variations and across the main line (Game::next_variation, previous_variation; previous from inside a variation goes to its first move). Headless: chess_pgn_edit's next_variation and prev_variation. The keys are new in the scope's table (Page Up and Page Down took nothing there; A8 P1c's full shortcut table is not done). A move the pointer rests on for 400 ms, or one with the keyboard focus, shows the position after it in a tooltip (plan HC13, 2026-10-26): in the boards' theme and pieces, its move marked, drawn once per position and kept, while the board keeps the move it shows; on by default, off in Preferences or with the control channel's move-preview, kept with the preferences. Nothing moves, so reduced motion has nothing to stop. Plan A8 P1b (2026-10-26): the board's move buttons are Lucide icons (chevrons-left, chevron-left, chevron-right, chevrons-right; the variation buttons chevron-up and chevron-down), named by their tooltips, and the promotion's Cancel and the editor's Close are the x icon: no loose ⏮ ◀ ▶ ⏭ ✕ characters, which some fonts draw as boxes; a test walks every button of the board panel and checks the interface fonts can draw its name. The palette of pieces on the light square is shared by the editor and the set-up view (it was already). The plan's cpu icon is not among the project's Lucide icons: Analyse keeps gauge. Plan A8 V4 (2026-10-28): Load PGN never drops a variation in silence: one with no move before it to replace (((…)), or one before the first move) or nested past 32 levels is kept as a comment where it stood, and the panel says how many (chess_pgn_edit: pgn_warnings with kind and address); the corpus of the plan (three levels, a variation on Black's first move, a comment before a variation, glyphs inside variations, 32 levels exactly and 33) reads, writes and reads back the same tree, by our reader and by python-chess as an outside process. Copy PGN copies everything; its right-click menu copies the main line only, without comments (the drawings written in them too) or without glyphs, the same options as chess_pgn_edit's and chess_export_pgn's variations (all, main, depth:N), comments and nags. Missing: the variations-only-to-depth choice is not in the menu (main or all), and Open PGN… and chess_games do not report the variations kept as comments yet. Plan A8 V3 (2026-10-29), the move list as a tree: each variation folds and unfolds by a chevron before its first move (folded, it keeps that move and says how many more it hides), a 2-point bar runs along its rows and a level past the eighth indent is written (N9); a Variations menu above the list expands all, collapses all or shows the main line only; the variation holding the move shown never folds. While the move shown is in a variation, a trail above the list (Main line › 1…c5 › 2.c3) goes to the start of each line, and screen readers hear it in one line (Variation 1 of 1 after 1…c5, move 2.c3). Where the move shown has several replies, chips under the board offer them (the one a step forward takes marked). A move played beside the reply there says Variation created: 1…d5 with Make main line and Undo. Two choices in Preferences (and the control channel's variations-at-fork, variations-new-move), kept with them: stepping forward at a fork follows the line remembered (default) or asks (the chips framed, ↑ ↓ choose, → or Enter go in, Esc takes the main line); a different move starts a variation (default), asks (New variation, New main line, Replace the continuation, Cancel) or replaces the continuation (the other replies go as an undo step of their own, with the deletion notice). ▶ off at the end of a variation says so; ⏭ goes to the end of the line shown, with Shift (and Shift+End) of the main line. Long games build only the rows of the notation in view (a line over 32 moves is cut into rows at White moves; the heights of rows out of view are kept from the frame before), the notation's tokens are worked out once per change (Game revisions are now unique across games) and so are the variation buttons' targets: about 9,200 moves with variations 32 deep add 1.3 ms to a frame (AMD Ryzen 5 8400F, the ignored test ten_thousand_moves_in_32_levels_cost_only_the_rows_in_view; 72 ms before). Missing: the columns layout is still built whole; a fold is kept for the session only, not with the game. Plan A8 P6 (2026-10-29): the board leaves the panel's scroll bar its room and is never wider than the panel (below 160 pt it is as wide as the panel); To move is a segmented control (each side a radio button for screen readers) here and in the Diagram tab; docked, the panel no longer repeats the Chess board title its workspace tab shows (Read mode and the chess window keep it); the Chess panel's Diagrams/Text tabs and the chess window's Board/Diagrams/Text tabs are drawn as the workspace's own. Plan A8 P7 (2026-10-29): the engine at one click. Analyze in a Diagrams list row's menu, the Diagram tab's gauge button (the position as edited) and the board's title (a toggle: Stop the analysis) put the position on the board with analysis on and the Analysis section open, an engine already running kept. With no engine running, picked or found, an assistant says how to get one (No analysis engine installed; Choose engine…, Open stockfishchess.org, Not now; or an engine folder beside PdfCraft); Not now and Esc leave analysis off. Analysis left on is on again in the next session (settings chess_engine.analysis; only true counts), and the lines found per position were already kept (MAX_KEPT). No headless tool: analysing runs a program of the user's, which an automation call should not start. Missing: the plan's cpu icon (gauge stands for it), and the engine on the web."

