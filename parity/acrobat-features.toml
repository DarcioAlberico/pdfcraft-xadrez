[[feature]]
id = "ocr.searchable-image"
title = "Searchable image output (invisible text layer)"
area = "I"
tier = "P0"
milestone = "M10"
status = "partial"
commands = ["ocr.recognize"]
tools = ["ocr_recognize"]
evidence = ["crates/engine/src/tests.rs::recognize_text_makes_a_scanned_page_searchable", "crates/engine/src/ocr.rs::a_figurine_in_the_ocr_layer_is_found_after_save_and_reopen", "crates/engine/src/ocr.rs::without_craft_fonts_figurines_become_san_letters_and_are_reported", "crates/ocr/src/lib.rs::the_unicode_layer_gives_back_figurines_and_signs_after_a_save"]
notes = "Invisible text (Tr 3) fitted to each word box; the image is not deskewed or downsampled (exact mode only). Text WinAnsi holds is Helvetica; other text (chess figurines, evaluation signs, any script) is a Type0 font (Identity-H, ToUnicode) made from a craft-fonts face (BIZ UDPGothic Regular, embedded whole once per document, about 4.6 MB); characters the face lacks use a stand-in glyph and keep their own code. Without craft-fonts, figurines become SAN letters and every replacement is reported (OcrPage::degraded). The recognition models still read only unaccented Latin, so today only text from other recognisers reaches the Unicode layer; ocr_recognize does not return the replacements yet."

