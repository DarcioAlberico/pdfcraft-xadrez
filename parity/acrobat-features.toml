 "crates/engine/src/chess/tests/capture.rs::a_stopped_move_offers_the_legal_moves_near_it", "crates/engine/src/chess/tests/capture.rs::the_move_number_is_not_part_of_the_word", "crates/automation/tests/chess.rs::chess_read_area_says_what_it_needs_and_stays_in_the_root", "crates/ui-egui/tests/chess_capture.rs::a_stopped_move_offers_legal_moves_that_go_in_only_when_clicked", "crates/ui-egui/tests/chess_capture.rs::the_correction_field_takes_the_glyph_palette", "crates/ui-egui/tests/chess_capture.rs::a_page_selection_is_corrected_in_its_glyphs", "crates/ui-egui/tests/chess_ocr_area.rs::an_ocr_reading_picked_rewrites_the_glyph_and_reads_again", "crates/engine/src/chess/tests/capture.rs::numbers_that_fit_nowhere_are_offered_renumbered", "crates/engine/src/chess/tests/capture.rs::the_renumber_choice_stands_beside_the_places", "crates/automation/tests/chess.rs::chess_pgn_edit_capture_applies_the_renumber_choice_when_asked", "crates/ui-egui/tests/chess_capture.rs::the_preview_offers_renumbering_as_its_own_choice", "crates/ui-egui/tests/chess_capture.rs::the_board_panels_glyph_palette_types_into_the_correction_field", "crates/ui-egui/tests/chess_capture.rs::the_rails_glyph_buttons_type_into_the_correction_field"]
notes = "An extension, not an Acrobat parity claim (fork decision D3); PGN toolbar spec steps T2a (and T2b's remainder), T3, T7a, T7b, T9 and T10. In the app (T7a and T7b, crates/ui-egui/src/chess_capture.rs): Capture (X; automatic, and the forced line, variation and sub-variation, Shift+X switching) and Comment (C; after or before the move, added to or in place of its comment, switches on the page's capture chip) on the PGN tool rail and as chess.tool.* commands; letting go of a text selection on the page with one armed captures it, Ctrl+V with the chess scope on and the board panel's Paste as ▸ capture pasted text, Send to PGN ▸ in the selection's action bar and the page's context menu captures without arming, and Ctrl+C captures too when the user turns that on (off by default, decision D5). The selection is read from its glyphs grown to whole tokens, in the document's language (the Text tab's reading, else English), with the copy permission enforced; a selection over 4 KiB is planned on a worker thread; a plan that needs no preview is applied as one undo step (Capture line/variation/sub-variation/comment) with Undo on the game even with the pointer on the page, the moves keeping their place on the page (NodeSource), and a plan made on a game changed since is planned again once. Any other plan opens a preview beside the selection on the page (T7b): where it goes (“Variation of 18…Qxe1”) with Fit at listing every place it fits, the language it is read in (switching reads it again and becomes the document's language for captures), its moves as chips (✓ played, ✗ where it stopped and why, grey not read, bold for the main line; glyphs, comments and brackets; the moves the reader could not play), why it is shown, and Apply (Enter, taken before anything else that uses Enter), Apply and keep the rest as a comment, Cancel (Esc); it follows the page as it scrolls and closes once the document is edited. A capture that went in leaves a notice with Undo (no timeout) until the game changes again, and its new moves are tinted in the move list (fading over 3 s; a plain tint until the next change with reduced motion). Underline captured text on the page (a switch in the board panel, kept with the preferences) underlines every move the document's games were captured from (their NodeSource). Where a selection goes is pdfcraft_engine::chess::capture::plan, used by the capture op of chess_pgn_edit (text inline, bold ranges, language, mode auto/line/variation/subvariation/comment/comment_before, apply chosen/auto/never): the candidate places are the move after which the absolute half-move is the first move's printed one on the current move's line and each line outward (only the main line as a variation; automatic capture takes a bold first move as the main line), each scored by reading the selection with the walker from that position and grafting it on a copy (most moves played, then fewest stops, then the inner line); a start at move 1 in a game with no moves is offered renumbered; the preview is asked for (with reasons) unless the reading is complete, the place unique and on the current line, no line end extended as a variation, no move demoted and nothing renumbered (D6 b); applying checks the revision planned on. The PGN toolbar spec scenario (steps 2-4) passes headless: the paragraph in one capture without the preview, the demoted different move, and the forced modes landing on the outer line. Planning the scenario paragraph takes 0.7-0.9 ms (plan_cost_on_the_scenario, release, 2026-10-21: 0.84 ms from the empty game, 0.86 and 0.69 ms from inside the sub-variation; one candidate each, and each candidate is one reading and one graft, so 35 at most stay near 30 ms), under the spec's 50 ms. Fuzzed (T16): xtask fuzz has a synthetic page of move text (a bold main line, analysis with brackets, ; and a) separators, glyphs as signs and $ codes, a null move, an unbalanced bracket, results, SemFig and FigurineCB figurines), and check-one --chess plans the first two pages' text (whole, its second half and as an OCR area's reading, at most 2,048 glyphs) in every mode on a game from the standard start and on the scenario's, applies each chosen plan and aborts if the game's PGN is not a fixed point. The reader, as a library: pdfcraft_chessvision::doc::fragment reads a selection's glyphs (text_of_glyphs, in the document's language, never guessed) with the book walker in fragment mode, from a given position, into the fragment items pdfcraft_chess::game::Game::graft takes (moves with their printed half-move, bold weight and user-space box; glyphs by White's code; comments before and after; variations; a result, with what follows it left over). One game per selection; prose stays comments; a lost bracket is assumed and flagged; a move without a number after prose words is prose; `;` and a) / (b) separate sibling variations; 1:0, 1-0 with a dash and (1-0) end it; 20.… and …Qd8 are notation; hyphens join only between letters at a line's end; a move that cannot be played is a stop and stays in the comment. Measured (examples/fragment_bench.rs, ten stored documents): re-reading each variation the walker built as a selection and grafting it gives the walker's own tree for 275 of 292 (94.2%; Dvoretsky 59/59, Fischer 81/89), most differences being the whole book's misreadings; on the same stretches read again with their weights (2026-10-20, so bold main lines count) 294 of 301 (97.7%; Dvoretsky 60/60 and 89/90, Fischer 90/92), above the spec's 95%. Re-run on 2026-10-21 (T16): unchanged. Whole books take the bracket, separator and ellipsis rules (walk_bench: 2,304 -> 2,327 valid, none worse). OCR area of scans (T9, crates/ui-egui/src/chess_ocr_area.rs): a rail switch (O, chess.tool.ocr_area) on the capture tools' source; with it on and a capture tool armed (switching it on arms Capture), a drag on the page draws a rectangle instead of selecting text, and it switches on by itself when a capture tool is armed on a page whose text layer is missing or poor (the Text tab's reading of the page, else Session::chess_layer_quality on the layer the view loaded, another program's invisible OCR over a scan included), once per page shown, the user's choice standing until the page changes; the capture chip says OCR area. The area is read off the interface thread (inline on the web and in tests) by pdfcraft_engine::chess::text_ocr::OcrAreaJob / Session::chess_read_area: only that rectangle rendered (a render tile, 300 dpi, less for an area over 4096 px a side), the glyph reader with the user's chess-glyphs model (or a classifier passed in), the general OCR for prose when installed, the fusion, the book's proven cipher (the Text tab's) and the repair, returned as a text layer of the page in view space with each glyph's top-3 readings kept for the corrections of T10; degenerate areas (not finite, inverted, under 4 pt, off the page) and a missing model are errors, never a panic. What was read goes through the same capture (CaptureText::Read: no weight on a scan, moves placed by their numbers, each keeping where it was printed); a word the cipher or the repair changed or doubted forces the preview with a note. Copy permission enforced; Esc drops a read in progress (the worker finishes and its result is thrown away; it is not interrupted); without the model the notice points to Chess models… and chess-glyphs.onnx. The glyph model comes from the folder chosen with Chess models…, else $PDFCRAFT_MODELS or beside the executable; on the web from the model files picked with Chess models… for the session (U4; the web build has not been run in a browser with the real model, only checked to compile). Measured with crates/engine/examples/ocr_area_bench.rs and the user's chess-glyphs model (dev profile, model load included, 55-205 ms an area): Aagaard, A Matter of Endgame Technique p. 49, two notation lines 8/8 moves and one 4/4, a prose paragraph read but its heading move 34.Bd5 misread; Gallagher, Winning With the King's Gambit p. 40 (no text layer), a dense column of eight lines 19 moves read, a narrow area across the column gutter mostly misread. Correcting (T10, crates/ui-egui/src/chess_correct.rs): a ✗ chip of the preview (a move the reader could not play, or the one the graft stopped at) opens a panel under the chips with the legal moves near it in the position it was to be played in (pdfcraft_engine::chess::capture::stopped_moves and nearby_moves: what pdfcraft_chess::repair makes of the move alone, that is the one reading it settles on, the moves an ambiguous reading fits, or the three closest legal moves, written in the capture\x27s language and never applied without a click), a correction field holding the move as printed with the full glyph palette (T6\x27s characters plus the ellipsis) inserting at its cursor (Enter or Read again takes it), and, for text read by the OCR area, the move\x27s characters with those whose top two readings are within a margin of 0.5 underlined, a click listing the reader\x27s top three readings. Each correction rewrites the move where it was printed (a page selection\x27s glyphs in the font of the move\x27s last glyph, so the weight stays; the OCR area\x27s text, a picked reading keeping the character\x27s box; or the pasted text) and plans the capture again; the preview waits for Apply, and a correction that fits nowhere is refused with a notice. The reader and the graft keep the position each stopped move was tried in (FragmentStop.fen, GraftStop.fen). Headless: chess_read_area reads an area of a page with the user\x27s glyph model (models_dir confined to --root; page, rect in user space, lang, general_ocr) and returns the text, the moves and every character\x27s top readings with its margin, and with fen or pgn (at, mode) the capture plan; that plan and chess_pgn_edit\x27s capture list the chosen place\x27s stopped moves with the legal moves near each (offered, never applied). Measured with the user\x27s model on a Helvetica line (1.e4 e5 2.Nf3 Nc6): read as 1 le4 e5 2.Nf3 Nc6, so the capture plays from move 2. Renumber is a choice of its own, not a place (CapturePlan::renumber, an index into the candidates that CapturePlan::places leaves out): when the first printed number names no place where a move without a number goes (after the move shown; as a variation, also as an alternative to it), the text is read from there with every printed number moved by the same amount, so the moves take the game's numbers (Candidate::shifted; Candidate::renumbering gives the first move as printed and as played, 12.Raxe1 played as 20.Raxe1); a number before the game's start, which the places read as prose, can be renumbered too; a game with no moves whose start says move 1 still takes the text's number at its start. It is never chosen over a place that plays a move, never makes one ambiguous and never goes in without the preview. In the preview Renumber is a toggle beside Fit at (which lists the places only): switched on it shows the text so played, its chips with the game's numbers and the line 19...Kh8 is played as 20...Kh8; switched off, the place chosen before; a correction or another language keeps it; Apply is one undo step. chess_pgn_edit's capture takes apply: renumber and reports renumber, shifted and renumbering. The board panel's floating glyph palette (U1, chess_annotate::palette_window) types into the correction field while it has the keyboard, a figurine and a glyph's sign alike, instead of annotating the move shown (the field is one of the palette's typing fields, Field::Correction); so do the rail's glyph buttons and their groups' menus (chess_annotate::pick_glyph, one rule for both: a glyph with a sign goes into the field that had the keyboard, an assessment without one still goes on the move; with the glyph brush armed the button still picks the brush's glyph), and they are on while a field has the keyboard even with no move shown, as before a capture. Missing: a single misprinted number inside the text (19 for 20) still stops the reading there, as renumbering moves every number alike and the correction field corrects the move, not its number; a number the page's text left in a prose run is not moved."

