evidence = ["crates/chessvision/src/doc/tests/html.rs::the_html_reads_back_as_the_document", "crates/chessvision/src/doc/tests/html.rs::an_unread_diagram_is_a_figure_without_a_position_and_no_unsafe_link_is_made", "crates/chessvision/src/doc/tests/html.rs::arbitrary_text_is_escaped", "crates/automation/tests/chess.rs::chess_export_html_writes_the_diagrams_in_order_and_reads_back", "crates/automation/tests/chess.rs::chess_export_html_outside_the_root_is_refused", "crates/automation/tests/chess.rs::diagrams_take_a_board_theme_and_drawings", "crates/chessvision/src/doc/tests/html.rs::diagrams_are_said_in_the_books_language_with_the_printed_page", "crates/ui-egui/tests/chess.rs::export_writes_pgn_and_markdown_with_images", "crates/ui-egui/tests/chess.rs::exporting_with_diagrams_to_review_asks_first", "crates/chessvision/src/doc/tests/html.rs::five_hundred_and_forty_eight_diagrams_stay_within_fifteen_megabytes", "crates/chessvision/src/pieces/svg.rs::symbols_draw_what_the_full_board_draws"]
notes = "An extension, not an Acrobat parity claim (fork decision D3). The recognised document (chess_document) as one static HTML file: headings, paragraphs with moves (Unicode figurines, letters in any of the 18 languages, or as printed), annotation glyphs, and each diagram redrawn as inline SVG with the same chess::draw drawing as the PDF replacement, or as FEN, with a lichess link under it. No script, nothing fetched; only http(s) addresses become links. Readable back by attributes (data-fen, data-san, data-nag, class unread/review). Pieces from PDFCRAFT_CHESS_PIECES or an installed Chess Merida, else geometric. Also in the interface: the Chess diagrams panel's Export menu. PNG diagrams, EPUB and OCR'd text are the other exports' and ocr.chess-text's. Plan HC7 (2026-10-25): every chess export (HTML, EPUB, Word, RTF, Markdown images) draws its diagrams in the board theme board_theme names (brown by default, as before; book hatches the dark squares in vector paths; wood, marble and paper draw flat in their colours). Missing: the interface's export keeps brown, and a book's diagrams carry no drawings to draw (a game's arrows are not exported as diagrams). Plan A8 P9b (2026-10-28): each SVG board is said to a screen reader by a title and a description in the book's language, joined by aria-labelledby (Diagrama 1, pág. xvii: brancas jogam; Brancas: Re1, Dd1…; pdfcraft_chess::describe, with the printed page number), the figcaption is the PGN's comment for the diagram (Pág. xvii · diagrama 2 de 3) before the lichess link, an unread diagram is said in the book's language, and html lang gives the book's language; data-fen is kept. review_marks (default on in HTML) turns the review highlight off. Plan A8 P9c (2026-10-28), for every chess export: the interface's Export menu (in the Diagrams panel's header and on the Text tab) names each format by what it makes under Export chess book (PGN — games, EPUB — e-book, HTML — web page, Word (.docx), RTF, Markdown); exporting while detected diagrams are still to review asks first (Diagrams not checked yet: n, with Review first, which opens the first of them, and Export anyway); once written, a window says where, with the export's notes (diagrams not read, a font only named) and Open folder, which shows the file in the system's file manager. Missing: the notice counts only the diagrams detected so far (an export before detecting asks nothing), and the notes are in English, as the engine writes them. Plan A8 P9b, size (2026-10-28): each piece is drawn once per file (once per page in an EPUB), as a <symbol>, and every board places it with <use> (href and xlink:href), so a book of 548 diagrams is about 3.8 MB of HTML with any shipped piece set (Fantasy reached 82 MB drawn in full); the boards draw the same paths as before."

[[feature]]
id = "export.chess-epub"
title = "Export a chess book as EPUB 3 with redrawn diagrams"
area = "I"
