notes = "An extension, not an Acrobat parity claim (fork decision D3). 2026-10-28, measured against born-digital books (their text layer the answer, the same pages read with ocr: all): columns whose baselines differ are broken into lines one by one, bold moves are told by their strokes (1.2 times the body) and marked bold for the walker, light-gray header boxes are frames, and seven misreadings are fixed (docs/chess.md, Scans measured against born-digital books); Ulf the Attacker 6 pages 144 -> 258 valid by OCR (text layer 257), 38 books 25,435 -> 25,570, OCR ground truth CER 1.24% -> 1.05%. Still missing: a bold heading at the body size is still a paragraph in some places (see Limits), and a page set mostly in bold has a bold body, so its bold moves are not told apart. Pages whose text layer is poor or missing, or is another program's OCR drawn invisibly (3 Tr) over a picture of the page (ocr: auto; or every page with ocr: all), are rendered at 300 dpi, their diagrams painted out, and read by the user's chess-glyphs model fused line by line with the general OCR (ocrs, for prose, when installed); the book's cipher and the legality repair run from the page's diagram (or the game start at 1.), and what they change or cannot settle is flagged for review. No model ships: without chess-glyphs nothing is read and the reply says so. In the app the model comes from the folder chosen with Chess models… (or $PDFCRAFT_MODELS, or beside the executable), and on the web from the files picked with it (U4). Measured: a scanned Helvetica line of ten moves is read 10/10 by the user's model; the Caissa benchmark (in-sample) gives CER 0.88% and 98.0% of moves fused. Two-column pages are read column by column. Scanned books (2026-10-22, measured with cargo xtask chess-bench on 38 books): letters a scan cut at their hairlines (d read as ( and 1, b as l and ), o as ( and )) are offered to the glyph model whole when the pieces stand at most 0.07 text scales apart and their union is one letter wide, and kept when the union reads better; an empty pair of brackets side by side (at most 0.25 scales apart, one letter wide) is a round letter cut in two and read as its union whenever the model reads that as a letter or digit (2026-10-23: Pinski 2005 prints every o and 0 that way, each arc read as a bracket at full confidence, so the union never read better: `n()t`, `()—()`, `1 ()`; 82 of 83 pairs on a page now read, and a lone digit before a word starting with an oval joins it as a move number, `1 O...` -> `10...`; 38 books 25,158 -> 25,221 valid moves, Pinski 1st ed. 521 -> 560, 2nd 950 -> 974, the 6 lost all valid by accident after a misread move the text now reads past; OCR ground truth CER 1.25% -> 1.24%, moves unchanged); on a page read from its picture (by chess OCR, or under another program's invisible layer), a move that is illegal where it stands is played as the one reading with c and e swapped in one of its files that is legal there (a scan loses the bar of an e: `cxf4` for `exf4`, `♘c7` for `♘e7`), never when two readings fit or the reading is ambiguous, and the move keeps a TextRepaired flag saying what it was (2026-10-24: 38 books 25,247 -> 25,324 valid moves, Pinski 1st ed. 564 -> 639; a text layer is never read so, since a born-digital book's illegal move is a line read in the wrong place and its c/e twin a wrong move that happens to be legal: a book on the Italian with an exact text layer lost 14 moves that way before the rule was limited to OCR; the 3 lost after it are a move valid by accident and two moves of the next variation that the now longer line takes in through an OCR's stray bracket; the OCR ground truth unchanged, the glyph reader untouched); a piece of a letter that a scan cut off and that stands over the letter (at least 75% of its columns over the letter's, at most 0.7 of its height, within its rows) is joined to it whenever the union reads as a letter or digit at 0.5 or more, and a u between a file, a rank or a figurine and a square is the capture's x (2026-10-24: Pinski 2005's g has an ear that comes off and reads y at 0.96, so `g5` read `gy5` and `game` `gyame`, an e's eye or a 6's bowl came off as `)`, and a gx glued together reads as the model's gu pair, `guf6`; 38 books 25,327 -> 25,412 valid moves, Pinski 1st ed. 639 -> 687 (+67 -19), 2nd 975 -> 1,002, Hawkins 2012 +11 -1; the 20 lost were valid by luck: without a stray bracket one line read `♖c8` for `♖e8` goes on the main line instead of its variation and takes the game's later moves with it, and a game now read further on one page no longer restarts on the next; the OCR ground truth unchanged line for line); a bracket between two small letters is part of a word and neither opens nor closes a variation: an OCR's broken o or e (`m(nre` for move, `ourc)d` for oured) or a word's optional ending (`move(s)`) (2026-10-24: in Pinski 2005 such a stray bracket left open made the labels `a)` and `b)` after it separators inside it, so a variation's `12 ♗a3` went on the main line; walk_bench on the 38 books 25,412 -> 25,438 valid moves, all in Pinski 1st ed., none worse); diagrams are painted out with a margin (1.5% of their side, at least 4 px) and an upright box more than twelve times taller than wide and taller than two scales is a rule, not a glyph, so a scan's board frame no longer joins the lines of both columns into one; a line right of a board narrower than its column is read by its height when the page has columns and another piece of its row lies over the board; and a full stop or comma between a file and a rank (bxc.3, Kb,6) is dropped when the word then reads as a move. Valid moves 23,327 -> 24,015 (Pinski 2nd edition 344 -> 765, 1st 234 -> 434, Meu Sistema 156 -> 214), books with a text layer unchanged; the Caissa ground truth unchanged (CER 1.25%, moves kept 97.9%); the general OCR (ocrs) for prose made these books worse (771 -> 608) and stays optional. 34 moves valid before are not now: they were read in a scrambled order that happened to work, and now stop at the next misread or at a game header the OCR does not see as a heading. Headings on scanned pages (2026-10-23): a frame drawn around text (three text scales each way, at most 12% inked) is no glyph and no longer hides what it holds as an outlined figurine's inner detail, and hollow outlines do not set the text scale; a frame around at most four lines of short text that it hugs (its text spans 40% of its width and half its height) is a heading, which ends the game before it (Pinski's `Game 12` box); a frame hugging a detected board (at most 1.6 times its area) is painted out with what it holds, and a larger box around a board and its caption is read and is no heading. chess-bench: 24,015 -> 24,239 valid moves, none lost (Pinski 1st edition 434 -> 516, 2nd 765 -> 907), the Caissa ground truth unchanged. Unframed titles on scanned pages (2026-10-23): a line whose glyphs stand at least 1.4 times as tall as the page's body text (a line's height is its glyphs' at 80% of them, the capitals' and ascenders', so lines of moves and of prose of one size measure alike), with three glyphs or more, is set larger; larger lines one under the other, at most a line apart, are one title, a heading (level 1 from 1.5 times) when it holds a short text and no line of body size (another column's). A title may name a move or two in its words (`White Plays 5 d3`), and its moves stay unplayed. chess-bench: 24,412 -> 24,423 valid moves (Pinski 2nd edition 939 -> 950, 1st 517 -> 521), 10 new headings, all chapter titles; 4 moves lost were moves in born-digital chapter titles (`French Defense - Tarrasch Variation: 3.Nd2`) that had been valid by chance and now stay unplayed in their heading. Bolder headings and shadowed boxes on scanned pages (2026-10-23): a box with a drop shadow (a thin outline with a thick edge offset on two sides, Pinski's `CHAPTER FOUR`, 12.4% inked) is a frame when it is a ring, all its ink within 15% of its box's shorter side from the edges and each side's band inked along 90% of it, inked on at most 30% (an `L` or an `O` as large stays a glyph), so the chapter number inside it is read, and is a heading by its size; a line set bolder than the page's body at the body's size (its strokes, twice its ink over its edge pixels, at least 1.35 times the body's; Pinski's bold measures 1.45 to 1.9 times, its italic running head 1.2), cut from the other column's text at gutters, with a blank line above it in its column (at least a text height) and a line below it, is a heading (level 2) when its words hold at least four letters and 60% of its characters; up to three such lines at the leading are one heading. Never the first or the last line of a column, nor a caption beside a board with no line between them (`Diagrama 51 Posição após c5`, `Fighting for the light squares`), and a bold main line misread as letters is mostly figures and moves. chess-bench: 25,221 -> 25,247 valid moves, none lost (Amateur to IM 222 -> 244: the header `Sasikiran — Carlsen` now starts its game from move 1; Pinski 1st edition 560 -> 564), valid from a diagram unchanged (10,601); headings 374 -> 381, all true (`CHAPTER FOUR` and `Summary` in both Pinski editions, `An active defense`, `Carlsen defends dynamically`, `Sasikiran — Carlsen`); the OCR ground truth unchanged (CER 1.24%, moves 639/653). Missing: a heading set only bolder at the top of a column, under a board or with no blank line above it is read as a paragraph, and a bold heading inside an annotated game ends the game as any heading does; outline display type (letters drawn as thin contours) would be taken for frames; letters outside ocrs's alphabet (umlauts) come through only where the glyph reader has them; the book cipher is carried between reads while the document is open and saved or loaded by the tools (cipher_out, cipher_in), not inside the PDF."

[[feature]]
id = "edit.chess-replace-diagram"
title = "Replace a chess diagram with a redrawn vector board"
area = "I"
tier = "P2"
milestone = "none"
status = "partial"
commands = []
tools = ["chess_replace_diagram", "content_draw"]
evidence = ["crates/engine/src/chess/tests/replace.rs::an_image_diagram_is_deleted_and_the_new_board_reads_back", "crates/engine/src/chess/tests/replace.rs::undo_restores_the_original_object_graph", "crates/edit/src/operators/tests.rs::a_fragment_is_drawn_on_top_in_its_own_tagged_stream", "crates/automation/tests/chess.rs::chess_replace_diagram_draws_a_vector_board_where_the_font_diagram_was", "crates/automation/tests/chess.rs::chess_replace_diagram_refuses_what_it_cannot_place", "crates/automation/tests/chess.rs::content_draw_adds_checked_operators_and_refuses_the_rest", "crates/ui-egui/tests/chess.rs::redraw_in_the_pdf_asks_first_and_reads_only_its_page_again", "crates/automation/tests/chess.rs::chess_replace_diagram_redraws_the_kept_correction", "crates/chessvision/src/pieces/svg.rs::no_image_reference_is_resolved_from_disk_or_a_data_url", "crates/chessvision/src/pieces/bundled.rs::every_shipped_set_reads_whole_and_fills_its_squares", "crates/automation/tests/chess.rs::chess_replace_diagram_draws_with_a_shipped_piece_set", "crates/engine/src/chess/tests/replace.rs::drawings_go_onto_the_page_over_the_board", "crates/chess/src/draw.rs::drawings_are_drawn_over_the_board_and_described", "crates/automation/tests/chess.rs::diagrams_take_a_board_theme_and_drawings"]
notes = "An extension, not an Acrobat parity claim (fork decision D3). A diagram the scan numbered is replaced, as one undo step, by a board drawn as vector paths (chess::draw, the same drawing the exports will use), upright as displayed and centred in the diagram's box. An embedded image that is the diagram is deleted; text in a chess diagram font is removed and its box covered; anything else (a scanned page, a vector board, an image with a caption) is covered with opaque white and stays in the content underneath. The edit names the document generation it was numbered at and is refused after any other edit. content_draw is the generic edit under it: checked content operators (no page resources, balanced, capped) as page content of their own. Pieces come from PDFCRAFT_CHESS_PIECES or an installed Chess Merida (never shipped), else plain geometric ones; eight openly licensed sets ship with PdfCraft (chessnut, rhosgfx, kiwen-suwi, firi, fantasy, spatial, celtic, shapes; ATTRIBUTION.toml) and are used when named, by id in PDFCRAFT_CHESS_PIECES or in the tools' pieces. Missing: choosing a set in the interface (plan HC2); the shipped sets draw their gradients flat, in the first stop's colour. A piece drawn from an SVG file is read from its own bytes alone: an image reference in it (a path or a data URL) resolves to nothing, a compressed (svgz) file is not inflated, and the file (8 MiB) and its XML entities (1 MiB added, none made of others) are bounded. In the interface (plan A8 P3b4, crates/ui-egui/src/chess_redraw.rs): Redraw in the PDF… (the Diagram tab's ⋯ and the classic editor) replaces the selected diagram with the position as corrected there (one undo step). The first time it asks (Redraw in the PDF draws the corrected position over the original. This changes the file; you can undo it with Ctrl+Z until you save.) with Redraw, Cancel (or Esc) and Don't show again, kept with the preferences once Redraw is chosen. The position drawn is kept as the diagram's correction (Verified when it is the reading, else Corrected) with the page as it is after the drawing, so the list says so whatever the redrawn board reads as and the correction follows the page; the editor stays on it with nothing left to confirm; only that page is read again, the list keeping every other diagram (an undo too). Headless the same: chess_replace_diagram with neither fen nor placement draws the position kept for the diagram in store (from_correction), and keep_correction keeps the position drawn with the page as it is after (correction). Plan HC7 (2026-10-25): the board drawn takes a board theme (board_theme: its squares' colours, book's hatched dark squares; brown by default; light and dark still override) and drawings (drawings: [%cal …] arrows and [%csl …] rings, as PGN writes them, drawn solid over the board and described in words in the result, for a text alternative). Missing: the interface's Redraw in the PDF passes no drawings (the editor has none) and keeps brown."

[[feature]]
id = "export.chess-document"
title = "Read a chess book's pages into a document of text, diagrams and games (JSON, PGN)"
area = "I"
tier = "P2"
milestone = "none"
status = "partial"
commands = []
tools = ["chess_document"]
evidence = ["crates/chessvision/src/doc/tests.rs::a_title_that_names_a_move_is_a_heading_and_a_main_line_is_not", "crates/chessvision/src/chess_text/tests.rs::a_move_number_split_by_ocr_is_joined", "crates/chessvision/src/doc/tests.rs::text_well_above_a_board_beside_it_is_read_before_it", "crates/chessvision/src/doc/tests.rs::a_question_under_a_board_in_a_grid_waits_for_it", "crates/engine/src/chess/tests/document.rs::a_chapter_page_becomes_heading_caption_diagram_and_its_game", "crates/engine/src/chess/tests/document.rs::a_page_without_text_needs_ocr_and_a_given_language_is_kept", "crates/chessvision/src/doc/pgn/tests.rs::a_written_game_reads_back_equal", "crates/automation/tests/chess.rs::chess_document_reads_the_page_into_blocks_and_writes_json_and_pgn", "crates/automation/tests/chess.rs::chess_document_outputs_outside_the_root_are_refused", "crates/chessvision/src/doc/tests.rs::texts_after_two_diagrams_find_their_own", "crates/chessvision/src/doc/tests.rs::a_game_goes_on_past_a_diagram_of_its_own_position", "crates/chessvision/src/doc/tests.rs::the_main_line_resumes_after_a_prose_alternative", "crates/chessvision/src/doc/tests.rs::brackets_can_hold_the_replies_to_a_move", "crates/chessvision/src/doc/tests.rs::a_diagram_can_have_a_solution_for_each_side", "crates/chessvision/src/chess_text/tests.rs::bare_move_numbers_before_moves", "crates/chessvision/src/doc/tests.rs::a_block_with_moves_is_never_a_heading", "crates/chessvision/src/doc/tests.rs::a_new_game_from_one_after_a_later_diagram", "crates/engine/src/chess/tests/document.rs::the_body_size_is_the_books_not_the_pages", "crates/chessvision/src/chess_text/tests.rs::stray_symbols_for_pieces_make_the_layer_poor", "crates/chessvision/src/chess_text/tests.rs::a_dagger_after_a_move_is_check", "crates/chessvision/src/chess_text/tests.rs::moves_cut_by_spaces_are_joined", "crates/chessvision/src/glyphs/tests.rs::page_text_glyphs_span_their_line", "crates/chessvision/src/doc/tests.rs::a_column_with_a_score_table_is_still_a_column", "crates/chessvision/src/doc/tests.rs::solutions_are_played_from_their_numbered_diagrams", "crates/chessvision/src/doc/tests.rs::a_caption_below_gives_the_puzzle_number", "crates/chessvision/src/doc/tests.rs::puzzle_labels", "crates/chessvision/src/doc/tests.rs::bare_numbers_link_solutions_to_diagrams", "crates/chessvision/src/doc/tests.rs::solutions_after_every_chapter_link_to_their_own_chapters_exercises", "crates/chessvision/src/doc/tests.rs::a_page_number_under_a_diagram_does_not_number_it", "crates/chessvision/src/doc/tests.rs::a_move_that_is_the_main_lines_next_goes_back_to_it", "crates/chessvision/src/doc/tests.rs::read_pages_replay_into_the_same_document", "crates/chessvision/src/chess_text/tests.rs::moves_in_a_bold_font_are_bold", "crates/chessvision/src/doc/tests.rs::bold_moves_are_the_main_line_when_analysis_comes_first", "crates/chessvision/src/doc/tests.rs::a_bold_move_takes_the_place_of_analysis_that_went_on_from_it", "crates/chessvision/src/doc/tests.rs::an_unnumbered_bold_move_goes_on_from_the_last_bold_move_played", "crates/chessvision/src/doc/tests.rs::a_bold_move_inside_analysis_does_not_make_it_the_main_line", "crates/chessvision/src/doc/tests.rs::a_moves_weight_is_in_the_json_only_when_bold", "crates/chessvision/src/doc/tests.rs::a_centred_diagram_goes_before_a_short_line_below_it", "crates/chessvision/src/doc/tests.rs::a_diagram_in_the_right_column_waits_for_the_left_one"]
notes = "An extension, not an Acrobat parity claim (fork decision D3). Pages become headings (blocks set larger than the body text), paragraphs of chess text (moves, move numbers, NAGs, figurines from catalogued fonts) and diagrams in the one reading order, each with its source box; moves are replayed with cozy-chess from the diagram before them or the initial position into variation trees, and illegal, ambiguous or out-of-sequence moves are flagged, never dropped. One piece-letter language for the whole document, from every page unless given. Output as JSON and PGN (inline or to files in the root). Pages whose text layer is poor or missing are read by chess OCR (ocr.chess-text) when the user's glyph model is installed, else listed in needs_ocr. In the interface: the Chess panel's Text tab (view.chess-recognised-text). Pages of two or more columns are read column by column (lines cut at a gutter that lines up across lines; since 2026-10-24 each side is cut again by a gutter of its own, up to four columns, and a line across some of the columns cuts only those into bands); a diagram's printed coordinates are left out. On a page of one column (no gutter, at least half of its lines across the middle), a line wholly below a diagram comes after it on either side of the middle, unless it lies under another board in its own column (2026-10-24). A page read alone (the Text tab, a game read across pages) takes the puzzle number captioned at the foot of the page before it: that page is looked at through its text layer and its diagrams' places, not read, and a page walked again after the page before it (DocBuilder::add_read_page) takes that page's foot caption, kept in the JSON as `trailing` (2026-10-24). Measured on the 38-book sample: valid moves 25,247 -> 25,247 (10,601 from a diagram), none gained or lost and no page's blocks reordered; the only three-column pages in the 38 books' text layers are one index of games (a table, no moves); the four books' samples that caption a diagram at the foot of the page before, read a page at a time, number 33 -> 41 diagrams, the same as read together. Games run on across pages and past a diagram of their own position (or one their next move cannot start from, flagged); a text after diagrams printed side by side starts from the diagram its first move is legal in (flagged); a move that cannot be played inside a prose alternative is tried on the main line; brackets after a move that hold the replies to it are played after it, the main line's own reply kept first; a diagram with a solution for each side to move gets a game for each; move numbers without a full stop (`19 Rxd5`, `15 … Rxb6`) are read; the body size for headings is that of all the pages read, and a block with moves is a heading only as a title that names at most two moves in twelve letters of words each (`White Plays 5 d3`), whose moves stay unplayed; a `1.` that the game from a later move's diagram cannot play starts the next game; an old OCR layer whose figurines became stray symbols (`&xe5`) is poor, so chess OCR rereads the page, without taking headings from that layer; `†` (or OCR's `✝`) after a move is check, `‡` mate; moves OCR cuts with spaces (`♖ e 1`, `f1 =♕`) are joined, and so is a move number an old OCR layer split at a space when its digits stand closer than words do (`2 1 .fxe6`, `1 8.Nf6+`, at most 0.19 of the glyphs' height apart; `Game 1 8.Nf3` keeps its space; 2026-10-23, Chess Tactics 4 132 -> 147), also over up to three words (`1 7 ...d xe5`); the same old layer's other misreadings are read again (2026-10-23): an `l` for a 1 after a file in a word that is notation anyway (`27.Rfl`, `Qxel`, never `Tal` or `Dahl`), an `S` for a 5 or an 8 only where one digit alone fits (a pawn's square is a 5, `dxcS`; a move number takes the digit that follows the line's number before it and leads to the one after, `24.Qg6 dxc5 2S.Rae1`: 25), bullets for an ellipsis's full stops (`25 •..`), and Black's move split from its number (`24. ..b xc5`, `36. ..Q xb3`; a bare number before a whole glued move, `1 ...Nef6`, is as often a number that lost a digit and stays prose); Chess Tactics 4 146 -> 286 valid moves, the 38 books 24,423 -> 24,562 (2 lost, both valid before only because the move read now, illegal from the board, was skipped). Missing: a piece's `S` (`RbS`) could be on either rank and stays unread, and so does a number with no move number beside it on its line; OCR'd glyphs span their line's height and a column with a score table beside its prose is still a column, so two-column scans read column by column; a diagram's caption number (`№185.`) links it to its solution pages later, whose moves are played from it (tagged PdfPuzzle), including a number alone above the diagram and before the key move (`1675 1.Rd3+`), and a workbook's exercises (2026-10-22): `Exercício 12` (also Exercise, Exercice, Ejercicio, Esercizio, Aufgabe, Übung, Ex.) numbers the diagram it captions, and the last such caption at the foot of a page numbers the next page's first diagram; a solution headed `Ex. 6–12` (chapter, then exercise) is played from it, through up to two headings (the players, the event) before its first move, and from the initial position when that first move does not start from the exercise (a game printed from move 1); an exercise label names a solution only standing alone (`Exercise 5 was hard` is prose). Measured on Construa Seu Xadrez (whole book): valid moves 3,986 -> 7,125, none lost, and 28 -> 337 numbered diagrams; the 38-book sample 23,146 -> 23,327. A workbook that numbers each chapter's exercises from 1 and prints the solutions later (2026-10-23): the numbered diagrams are kept by chapter (a new group where the numbering starts again, with the headings read before it), and a number several chapters have goes to the chapter the solution's label gives (`Ex. 6–12`), to the one chapter a heading over the solutions numbers (`Chapter 6`, `Solutions to Chapter IV`, `CAPÍTULO 7`, also chapitre, capitolo, Kapitel) or names (the chapter's heading repeated word for word), or else by the chapters' order (the solutions numbering again for each chapter); a label beside the diagram it captions is not counted as a solution; nothing is guessed from the moves. A bare number alone at the head or foot of a page, as far from the page's index as a page number seen on the pages read before it, is the page's number and no longer numbers a diagram at the foot of the page. Measured on the 38-book sample: valid moves 24,423 -> 24,423 (none gained, none lost; 10,203 valid from a diagram), and 15 diagrams that a page number had numbered (Chess Tactics 3, Chess Imbalances, Coffeehouse Repertoire 2, the Tarrasch, Playing the Stonewall Dutch, The Agile London System, 100 Finais) no longer are, no real caption lost; no book of the 38, read whole, numbers each chapter's exercises from 1 and prints all the solutions later, so the chapter linking is proven by synthetic tests only. Missing: a chapter named over its solutions by a title worded differently, or one with no heading where a chapter has no solutions (the chapters' order then shifts); the page number of the first page read, with no page before it, can still number a diagram. On a page with no columns, text right of a board that ends more than 30% of the board's height above it, with no other board above it in its own column, is read before the board (2026-10-23, Chess Tactics: the board and its label on the left, the solutions on the right, where both boards of a page used to come before all its text); the board's own solution, starting level with its label, still follows it. Chess Tactics 4 went from 44 to 132 valid moves, the 38 books 24,239 -> 24,397 (2 moves lost, both read before from a board that had jumped ahead). A numbered move that is exactly the main line's next move goes back to the main line after a prose digression instead of becoming an alternative inside it (2,036 -> 2,304 valid moves on ten earlier documents replayed with examples/walk_bench.rs); DocBuilder::add_read_page judges the moves of pages read before again. Each move carries its printed weight (bold, from the text layer's font); in a game with both weights the bold line is the main line and a bold move after analysis goes on from the last bold move (2,305 -> 2,515 valid moves on ten stretches read again, walk_bench with and without --plain; 7 worse, all on branches already wrong). When a diagram's text first gives the move before it for the other side (the alternative to the move that led to it: `A dreadful blunder.` under a board with White to move, then `the correct way: 7...d3`), that move cannot be played from the board but its number still numbers the diagram, so the bold game after it (`8.Nxe4`) is played from it; before, the board took the number 7 for White's move and nothing after it fitted (2026-10-23: 38 books 24,562 -> 25,158 valid moves, none lost; Catastrophes & Tactics 8 438 -> 797, whose whole games from `1.e4` a diagram game that never moved no longer swallows; Mastering Chess Defence 349 -> 445). A diagram also goes before a line wholly below it on its side of the gutter (or of the page's middle), so a short move line at the left margin under a centred diagram is read after it (Fischer pp. 30-59: 706 -> 1,139 of 1,179 valid). A \"position after\" caption under a diagram (`Position after: 11...Ba6`, `Posição após 23.Nf5`, `Stellung nach`, `après`, `después de`, `dopo`, `na`) is read as the move that led to it (2026-10-22): when the move cannot be played from the diagram and its piece already stands on its square, it is not played again but gives the diagram its side to move and number (move status caption; a reading whose side was not assumed and disagrees keeps its side). Measured on a 20-page sample of each of 38 books read again with pdfcraft-cli chess_document: 22,576 -> 22,889 valid moves (The Modernized Catalan 315 -> 605, Meu Sistema 133 -> 156), 323 moves became valid and 10 did not stay valid, all in brackets that give an alternative to the caption move itself (`Position after: 11.Qc2 [11.e4 ...]`), which before were played on the board with 11.Qc2 already made and which no line from the diagram can hold. Missing: a line still stops at a move that cannot be played (a misprint, or a line on the wrong branch) until a numbered move finds its place; a game whose first chain of moves is a digression keeps it as its main line when the book has no bold main line or the page is a scan; more than four columns are read as four, and a table set in columns (an index of games) is read column by column too; on a page of short lines with no gutter (perhaps two columns too short to find one), a diagram wholly on one side of the middle still comes after a line below it on the other side; a page read alone takes the caption at the foot of the page before only from that page's text layer, so on a scan it is lost."

[[feature]]
id = "view.chess-recognised-text"
title = "See a chess page's recognised text beside it"
area = "I"
tier = "P2"
milestone = "none"
status = "partial"
commands = ["chess.source.show", "chess.source.follow"]
tools = []
evidence = ["crates/ui-egui/tests/chess.rs::the_text_tab_shows_the_page_read_as_chess_text_and_points_back_at_it", "crates/ui-egui/tests/chess.rs::export_writes_pgn_and_markdown_with_images", "crates/ui-egui/tests/chess.rs::the_book_origin_is_kept_and_the_page_is_read_again_under_it", "crates/chessvision/src/doc/tests/board.rs::the_documents_games_go_onto_the_board_with_their_places", "crates/chessvision/src/doc/tests/board.rs::comments_before_stay_on_their_moves", "crates/chessvision/src/doc/tests/board.rs::a_move_the_board_refuses_ends_its_line_and_is_counted", "crates/ui-egui/tests/chess_book.rs::a_move_of_the_text_tab_opens_its_game_on_the_board", "crates/ui-egui/tests/chess_book.rs::a_game_running_on_to_the_next_page_opens_whole", "crates/ui-egui/tests/chess_book.rs::a_move_with_no_game_around_it_says_so", "crates/engine/src/chess/tests/document.rs::a_game_is_read_on_across_the_pages_around_a_move", "crates/engine/src/chess/tests/document.rs::a_game_span_reads_at_most_four_pages_each_way", "crates/engine/src/chess/tests/document.rs::a_page_that_cannot_be_read_ends_the_span", "crates/engine/src/chess/tests/document.rs::a_whole_game_on_its_page_reads_no_other_page", "crates/ui-egui/tests/chess_book.rs::follow_scrolls_the_page_to_each_move_shown", "crates/ui-egui/tests/chess_book.rs::a_captured_game_follows_its_moves_on_the_page"]
notes = "An extension, not an Acrobat parity claim (fork decision D3). The Chess diagrams panel's Text tab shows the page displayed beside it read as a chess document: headings, paragraphs with moves coloured by what replaying them found (valid, illegal or ambiguous, out of sequence or not reached, unchecked), annotation glyphs and the diagrams as small boards. It follows the page (its text layer); chess OCR reads it on request. Book origin, kept with the document: Auto (each page decides; exports read with chess OCR where a layer cannot be believed), Born digital (never chess OCR; a poor layer is read as it is, with a note) or Scanned (every page and export read with chess OCR). Clicking a move or a paragraph outlines it on the page; a diagram opens in the editor. A double-click on a move (or Open this game on the board in its menu) puts the page's game it belongs to on the board at that move (PGN toolbar T8): built move by move from the walker's score (chessvision doc::games::to_game / ChessDoc::board_game, not through PGN text), so comments before a move stay on it and every move keeps where it was printed; a new game of the document's collection, from its diagram when it started from one, and the same untouched game opened again is shown again rather than added twice; moves the board refuses (past its limits) end their line and are counted in a notice. Show in PDF (rail, a move's menu, chess.source.show) and Follow (F, chess.source.follow, a switch for the session) scroll the page to where the move shown was printed, only when it is off screen, and outline it, for a book's game and a captured one alike, with the chess panel in its own window too; a move with no place on the page shows nothing and the switch's name says so. Figurines show when the interface fonts have them, else moves as printed. Export… writes the whole document in the six chess formats. A game opened from the Text tab is read on across its page's edges (2026-10-23, engine chess::span): the pages before and after are read alone the same way, on the worker thread, and walked again with the page in order, at most four each way, back while the game may have begun earlier (not at a `1.`) and on while it has no result and its last move ends the page's games; a page that cannot be read, takes the move out of its game or holds none of its moves ends the run (so prose on the next page is not taken for the last move's comment). A move with no position on its page alone (the top of a page going on from the page before) also opens: its game is looked for on the pages before, and a move in no game says so. A page read alone takes the puzzle number captioned at the foot of the page before it, from a look at that page (its text layer and where its diagrams are), and pages read across a game pass their foot captions on when walked again (2026-10-24; on four books' samples read a page at a time, 33 -> 41 numbered diagrams, as many as read together). Missing: a full-width or tabbed layout beside the panel, editing the recognised text and writing it back as a text layer (S13d); a game opened from the Text tab reads at most four pages each way from its page, so a longer game is cut there, and a puzzle number captioned at the foot of the page before a page read alone is carried only from that page's text layer (on a scan it is lost); Follow never follows into another document or turns the PDF view's own page when the board's game belongs to another one. Reading a page and exporting run on a worker thread, on a session of their own opened from the working bytes; a result of a state the document has left is dropped. They cannot be cancelled."

