notes = "An extension, not an Acrobat parity claim (fork decision D3). Every game found in the text (variations, NAGs, comments, SetUp/FEN from the diagram it starts at) and a game with no moves holding a diagram's position for the diagrams the positions option says (plan A8 P8b: unused, the default, those no game starts from or reprints; all; none), a position first where a game starts from the same diagram; a diagram that reprints the position a game's main line reached marks that move with $220 (only in the PGN: the reading's own game keeps the book's text); variations (all, main, depth:N), comments and nags (all or none) leave things out of the moves, never the tags (plan A8 V4; comments none drops the opening origin comment too); the reply's positions_skipped lists each diagram that was to get a game and did not, with the reason (not_read, illegal, repaired); the book's order; a position that did not pass review says so. Where each game came from (plan A8 P8a, one PgnOrigin type in the chess crate for both PGN writers): PdfPage stays the physical page from 1, PdfPageLabel is added when the printed number differs, PdfDiagram, PdfPuzzle, SourceTitle (the export title); tags only ever added. A first comment names the page and diagram in the book's language (Pág. 17 · diagrama 1 de 2), since ChessBase drops unknown tags; a position's game has the title as its Event and Round -, a real game keeps its own. A game opened on the board from a diagram gets the same tags in the same order (SetUp/FEN before the other tags in both writers), but no comment (the board does not know the book's language yet). A move whose SAN holds nothing PGN can write is named again from the positions, never written -- (a null move); a move no legal move explains stops the line with a comment. Golden test (castling, en passant, Black's 23rd move first, } and % in a comment, NAG 146, a title with quote and backslash) read back by both readers, and by python-chess as an outside process (skipped without it). In the interface the Export menu holds the choice (Diagrams as PGN games: only those not in a game, all of them, none; for the session, plan A8 P9c). Missing: the choice is not kept between sessions, a diagram reprinting a variation's position is not marked, nor a diagram that reprints a game's starting position (no move to mark); a token longer than 79 columns stands alone on its line (PGN allows 255). Reads back with the same parser. Games on scanned pages come from chess OCR (ocr.chess-text), with its accuracy."

