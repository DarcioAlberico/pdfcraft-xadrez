commands = []
tools = ["chess_export_epub"]
evidence = ["crates/engine/src/chess/tests/epub.rs::the_package_is_well_formed_and_every_reference_resolves", "crates/engine/src/chess/tests/epub.rs::the_archive_starts_with_the_stored_mimetype", "crates/engine/src/chess/tests/epub.rs::a_book_without_headings_lists_its_pages_and_limits_hold", "crates/automation/tests/chess.rs::chess_export_epub_writes_a_book_inside_the_root_only", "crates/engine/src/chess/tests/epub.rs::the_cover_is_one_manifest_item_that_resolves_to_the_first_page", "crates/engine/src/chess/tests/epub.rs::chess_export_writes_the_book_with_its_cover", "crates/engine/src/chess/tests/epub.rs::a_book_without_headings_lists_its_pages_and_limits_hold", "crates/engine/src/chess/tests/epub.rs::the_book_says_how_it_can_be_read_and_where_each_page_is", "crates/chessvision/src/text_font.rs::a_font_that_may_not_be_embedded_is_refused_and_said"]
notes = "An extension, not an Acrobat parity claim (fork decision D3). The chess HTML export cut into one XHTML content document per PDF page (same markup, inline SVG boards, lichess links), a navigation document from the headings (or the pages), the package document (stable identifier from the PDF bytes, dcterms:modified) and the OCF container, with mimetype first and stored. Every XML file is checked well-formed and every manifest, spine and navigation reference resolves in tests. A cover: the book's first page drawn by the page renderer as a PNG at most 1600 px on its long side, one manifest item with properties cover-image (EPUB 3) named by <meta name=cover> for EPUB 2 readers; tests check there is exactly one, that it resolves to the stored PNG and its size, through the export entry point too. When the page cannot be drawn the book has no cover and the export's notes say so (seen with a deliberately broken scale; no standing test, as no synthetic page fails to draw). No script, nothing fetched. Missing: validation by epubcheck (not installed here), an embedded font with figurines (none in craft-fonts yet; readers use their own fonts), a cover page in the spine (readers show the cover image from the manifest). Also in the interface: the Chess panel's Export menu. Plan A8 P9b (2026-10-28): the pages carry the HTML export's accessible boards (title and description in the book's language, figcaption as the PGN comment), and the table of contents names pages in the book's language with their printed numbers (Pág. xvii). P9b second part (2026-10-28): the package says how it can be read (schema:accessMode textual and visual, accessModeSufficient textual, accessibilityFeature alternativeText, structuralNavigation, tableOfContents, readingOrder, pageNavigation, accessibilityHazard none, an accessibilitySummary), dc:creator (the PDF's author) and dc:source (its file name); every page starts with a doc-pagebreak named by its printed number, listed in a hidden page-list nav; the pages share one styles.css; the identifier comes from the PDF's /ID[0] when it has one (it outlives saving), else from its bytes; the review highlight is off in a book unless review_marks asks for it; a user font whose OS/2 fsType says Restricted License is refused and text_font says why. Missing: validation by epubcheck (a test runs it when installed, ignored by default; not installed here), and the size budget: 548 diagrams make 10 MB of HTML with the geometric pieces but up to 82 MB with a shipped set (Fantasy), so <symbol>/<use> per piece is the next step."

