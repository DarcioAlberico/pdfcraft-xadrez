[[feature]]
id = "organize.cut-pages"
title = "Cut pages into parts (the Knife)"
area = "D"
tier = "P2"
milestone = "none"
status = "partial"
commands = ["page.knife", "page.split_spreads"]
tools = ["page_cut"]
evidence = ["crates/ui-egui/tests/knife.rs::the_line_snaps_to_a_scans_gutter", "crates/organize/src/tests.rs::an_annotation_crossing_the_cut_is_on_both_parts", "crates/engine/src/tests.rs::cutting_a_scan_with_trim_keeps_its_picture_on_both_halves", "crates/organize/src/tests.rs::a_spread_cut_down_the_middle_is_two_pages_with_their_own_annotations", "crates/organize/src/tests.rs::cuts_follow_the_page_as_shown_whatever_its_rotation", "crates/organize/src/tests.rs::crop_trim_user_unit_and_right_to_left_are_honoured", "crates/organize/src/tests.rs::several_pages_are_cut_at_once", "crates/organize/src/tests.rs::cuts_that_do_not_fit_are_refused", "crates/organize/src/tests.rs::destinations_go_to_the_part_holding_their_point", "crates/automation/tests/automation.rs::cutting_pages_through_tools", "crates/ui-egui/tests/knife.rs::clicks_place_cuts_and_enter_cuts_the_page", "crates/ui-egui/tests/knife.rs::shift_cuts_across", "crates/ui-egui/tests/knife.rs::a_placed_cut_is_dragged", "crates/ui-egui/tests/knife.rs::knife_choices_are_kept", "crates/ui-egui/tests/knife.rs::split_double_pages_finds_a_scans_gutter", "crates/ui-egui/src/knife.rs::a_scans_gutter_is_found_without_text", "crates/ui-egui/tests/knife.rs::split_double_pages_cuts_spreads_and_trims_them", "crates/automation/tests/automation.rs::cutting_with_trim_leaves_each_part_its_own_text", "crates/ui-egui/src/knife.rs::the_gutter_is_the_widest_gap_near_the_middle"]
notes = "Beyond Acrobat, where a page is split only by cropping copies by hand (plan/borracha-e-faca.md B1, decision D5). pdfcraft_organize::cut_pages cuts pages along vertical or horizontal lines placed on the page as shown (rotation and /UserUnit applied): the page itself is the first part and copies inserted right after it are the others, each showing its part through its media and crop boxes, its bleed, trim and art boxes cut to it; left or top first, or right to left. Nothing is erased: a part's content outside it stays in the file. The copies are made without annotations, and each annotation goes to the part holding its centre (a pop-up with its parent), so a form field keeps one widget. Cuts are checked first: numbers inside the page, at least 1 pt apart and from the edges, at most 16 parts, one cut per page. Edit::CutPages (Cut page), undoable. Headless: page_cut (pages, axis, at in pt or as fractions, right_to_left; returns each page's parts). In the app (B2): Knife (cut pages) in Edit a PDF and Organize pages (page.knife) draws a dashed line under the pointer, upright or (Shift held, or Across in the panel) across; a click places a cut, a right-click takes the nearest away, Enter or Cut cuts (one undo step), Esc lets go; a line snaps to the middle and to the widest gap between columns of text near it; the cuts apply to the current, the selected or all pages at the same places, right part first if asked. B3: with Remove what lies outside each part (trim_outside on Edit::CutPages and page_cut) each part then has its text, images and drawings outside it erased with the content eraser (edit.erase-content), so a half's text is its own in search and extraction (an ordinary edit, not a secure removal); Split double pages (page.split_spreads) cuts every page shown wider than tall, or the selected pages, once upright at the gap between its columns of text when its text is known, else at its middle. Destinations that open a point on a later part go to that part (2026-10-25): bookmarks, links (a /Dest or a GoTo action), the legacy /Dests and /Names /Dests named destinations and the /OpenAction, by the point /XYZ, /FitH, /FitV, /FitR (and the B forms) give; a /Fit, with no point, stays on the first part. A placed cut is dragged to where it should be, and the Knife's choices are kept between runs (2026-10-25). Split double pages finds a scan's gutter without a text layer (2026-10-25): the page rendered small, the widest run of columns in its middle that ink seldom crosses going down, so a white margin and the spine's dark shadow both count. With the outside removed, an image a part only partly shows is clipped, not cleared: a scanned spread cut in two keeps one shared picture, each half showing its half (2026-10-25; before, a JPEG scan was removed from both halves). An annotation crossing a cut is copied onto each other part it crosses, with its pop-up, so a highlight over the gutter shows on both halves; a form field's widget is not copied (2026-10-25). On a page without text the Knife's line also snaps to the gutter found in its picture, rendered once per page and edit, upright or across (2026-10-25). Nothing the knife plan named is missing now."

