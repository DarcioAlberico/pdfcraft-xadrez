evidence = ["crates/engine/src/chess/tests/text_ocr.rs::a_character_becomes_a_32_pixel_gray_sample", "crates/engine/src/chess/samples.rs::class_folders_follow_chessvisionoffs_names", "crates/engine/src/chess/samples.rs::names_start_with_the_confidence_and_never_overwrite", "crates/ui-egui/src/chess_samples.rs::only_collecting_takes_corrections_and_a_declined_document_gives_none", "crates/ui-egui/tests/chess_ocr_area.rs::a_corrected_character_is_saved_for_retraining_only_when_collecting", "crates/ui-egui/tests/chess_ocr_area.rs::a_protected_document_is_asked_about_and_a_no_saves_nothing", "crates/ui-egui/tests/chess_ocr_area.rs::a_protected_document_allowed_saves_what_waited", "crates/automation/tests/chess.rs::chess_glyph_sample_writes_the_review_queue_layout_inside_the_root", "crates/automation/tests/chess.rs::a_glyph_sample_folder_outside_the_root_is_refused", "crates/automation/tests/chess.rs::an_encrypted_document_gives_a_sample_only_when_allowed", "crates/automation/src/chess_sample.rs::a_session_writes_glyph_samples_up_to_its_caps_and_no_more", "apps/pdfcraft-cli/tests/chess.rs::chess_glyph_sample_runs_from_a_script_inside_the_root"]
notes = "An extension, not an Acrobat parity claim (fork decision D3, D9 b: opt-in); PGN toolbar spec step T11 (crates/ui-egui/src/chess_samples.rs). Collect corrected characters for retraining (off by default, in the capture chip's menu with the folder, kept with the preferences; desktop only, hidden on the web): every character of an OCR area corrected by hand in the capture preview (T10: a reading picked for it, or a corrected move whose characters keep their boxes one for one) is saved as a 32 x 32 gray PNG (Session::chess_glyph_sample: the box rendered again at the area's resolution, padded with white to a square, scaled) in <folder>/<class folder>/<confidence in thousandths, 4 digits>_<16-digit hash of the document>_p<page>_<n>.png, the layout of ChessVisionOFF's review queue (revisao_ocr), the class folder named by the rule of its text/classes.py char_to_folder (upper_, lower_, digit_, sym_<code point>, ligature_ and ligature_hex_), reimplemented from the rule. Never overwrites (n counts up past existing files), written atomically, at most 2,000 a session (then a notice). A document that does not allow copying gives none; an encrypted one is asked about once per document and session, and declined, nothing of it is written. Nothing is trained in the app and nothing leaves the computer. Wave 10 U3: the names and places (class folder, confidence/hash/page name, the first free n) are the engine's chess::samples, which the app and the headless tool both use. Headless: chess_glyph_sample writes one sample of a box given in view space (as chess_read_area's alternatives give it) with its corrected text and confidence into a folder confined to --root (the file finally written is resolved again, so a class folder that is a link out of the root is refused; the confinement test fails with confinement switched off); refused for no-copy documents, and for encrypted ones unless allow_encrypted; one automation session writes at most 10,000 samples and 16 MiB of them, and the call past either cap is refused and writes nothing (the cap test fails with either check switched off). Missing: the web (no folder to write to, although since U4 the glyph model itself can be loaded there from files), and samples of characters the general OCR read (only the glyph reader's boxes have a confidence)."

