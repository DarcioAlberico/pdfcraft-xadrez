notes = "An extension, not an Acrobat parity claim (fork decision D3); 2026-10-24. The Move list is a docking panel (docking id moves) showing the board's game: the notation at the panel's full height, the glyph brush's bar while it is armed, and the glyphs and comment of the move shown under it; a click on a move goes to it on the board, and a move's menu is the notation's (rail tools, glyphs, diagram mark, copy line, delete). chess.move_list (Move list beside the page: the command and a toggle in the Chess board panel's title row) opens it against the page's right edge, 260 pt wide, or closes it. Its tab's menu (Side of the page: Left, Right) and two buttons in its own title row put it against the page's left or right edge, between the page and the Tools or Inspector panels; the side is kept while it is closed and in the saved layout, and the control channel's set moves-side left|right does the same (its state reports moves_side). Read mode draws it as a side panel on that side. The notation is drawn in one place: while the list shows, the Board panel and the chess window keep the board, the Analysis section, the games and the FEN, PGN and details sections, and the notation is in the list only (also when the board is in its own window); closed, or behind another tab, the notation is back under the board. It can also be dragged, floated or tabbed like any panel. Missing: no headless tool (the list is a view of the board's game, which chess_game already drives), and it has no layout of its own for the chess window: with the board in its own window on another monitor, the list stays beside the page in the main window."

