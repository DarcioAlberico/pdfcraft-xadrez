notes = "An extension, not an Acrobat parity claim (fork decision D3). Since plan A8 P9a (2026-10-28) the recognised document is written as a flowing document by pdfcraft_export::flow, not through Export a PDF's page writers (which are unchanged): Word headings (Heading1-3), paragraphs of runs in the book's language (w:lang in the defaults; dc:language in the core properties), the moves and annotation glyphs marked w:noProof (RTF \\noproof) so spelling checks skip them, piece letters and signs in the user's figurine font (SemFig) and sign font (ISChess) when the export found them, as the HTML export sets them (named on the runs, not embedded: the reply's notes say they must be installed where the file is read, and RTF lists them in its font table). Each diagram is a PNG drawn with the same board and operators as the PDF replacement, at 900 px by default (300 ppi for the 216 pt it is set at), whose text alternative says the position in words in the book's language (wp:docPr descr; RTF wzDescription), in a Figure paragraph kept with its caption (keepNext), the caption in Word's Caption style: the PGN's comment for the diagram, its FEN, and the lichess address as a real hyperlink (w:hyperlink to an external relationship; RTF HYPERLINK field; only http, https and mailto addresses become links). An unread diagram is said in words. Tested by parsing every Word part as XML, balancing the RTF groups and reading back alt text, styles, fonts and links; not yet opened in Word. Plan A8 P9a, second part (2026-10-28): Word also carries each diagram as SVG, the same drawing (asvg:svgBlip in the picture, the PNG kept as the fallback older readers show), and RTF names the book's language and a run's own by their Windows numbers (\\deflang, \\lang; pdfcraft_export::flow::rtf_lang knows the 18 notation languages and some others). Missing: checking whether a named font is installed, and opening the files in Word by hand. Also in the interface: the Chess panel's Export menu."

