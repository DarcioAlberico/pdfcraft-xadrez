# Tests known to fail on `main`, and why (plan A9-Q1a). `cargo xtask chess-gate` fails on any
# test failure not listed here, and on a listed test that passes again unless its kind is
# "flaky": a fix takes its line out, so the list never hides a new failure nor goes stale.
#
# test   = "<package> <test name as cargo prints it>", or "<package> <target> (crashed)" for a
#          test binary whose process died, the target as cargo's rerun hint names it
#          ("--test content").
# reason = why it fails, in a few words.
# since  = the date it was first seen failing on main.
# kind   = "upstream" (fails on the PdfCraft main this fork merges), "machine" (this machine's
#          setup: fonts, printers, drivers), or "flaky" (sometimes passes).

[[failure]]
test = "pdfcraft-ui-egui --test chess_theme (crashed)"
reason = "an access violation while rendering screenshots, seen once in a full ui-egui run; passes on re-run"
since = "2026-11-12"
kind = "flaky"
